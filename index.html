:root{
  --paper:#F5FAF7; --panel:#FFFFFF; --ink:#14261C; --muted:#53655B; --line:#D3E5DA; --soft:#EDF6F0;
  --flame:#157A45; --flame-soft:#E6F8EE; --mint:#E6F8EE; --green:#3ECF86; --blue:#3AA9FF; --lilac:#D9A8FF; --sun:#F5D76E; --coral:#F27A7A;
  --ok:#157A45; --ok-soft:#DDF5E8; --warn:#7A5B00; --warn-soft:#FCF3D1; --bad:#B42318; --bad-soft:#FDE7E6; --idle:#53655B; --idle-soft:#EEF3F0;
  --p-exp:#157A45; --p-ofi:#0B67B5; --p-noof:#7B3FB8; --p-calc:#7A5B00; --p-inf:#53655B;
  --b-exp:#3ECF86; --b-ofi:#3AA9FF; --b-noof:#D9A8FF; --b-calc:#F5D76E; --b-inf:#9AABA2;
  --t-exp:#E6F8EE; --t-ofi:#E6F3FF; --t-noof:#F7EEFF; --t-calc:#FDF6D8; --t-inf:transparent;
  --radius:6px; --shadow:0 1px 2px rgba(20,38,28,.08);
  --font:"Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-head:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1712; --panel:#14211A; --ink:#E2F1E8; --muted:#97AEA2; --line:#26392E; --soft:#1A2C22;
    --flame:#3ECF86; --flame-soft:#173425; --mint:#173425; --green:#3ECF86; --blue:#3AA9FF; --lilac:#D9A8FF; --sun:#F5D76E; --coral:#F79A9A;
    --ok:#3ECF86; --ok-soft:#173425; --warn:#F5D76E; --warn-soft:#332E12; --bad:#F79A9A; --bad-soft:#3A1E1E; --idle:#A0B1A8; --idle-soft:#1E2C25;
    --p-exp:#3ECF86; --p-ofi:#6FC0FF; --p-noof:#D9A8FF; --p-calc:#F5D76E; --p-inf:#A0B1A8;
    --b-exp:#3ECF86; --b-ofi:#3AA9FF; --b-noof:#D9A8FF; --b-calc:#F5D76E; --b-inf:#7E8F86;
    --t-exp:rgba(62,207,134,.12); --t-ofi:rgba(58,169,255,.12); --t-noof:rgba(217,168,255,.12); --t-calc:rgba(245,215,110,.12); --t-inf:transparent;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0E1712; --panel:#14211A; --ink:#E2F1E8; --muted:#97AEA2; --line:#26392E; --soft:#1A2C22;
    --flame:#3ECF86; --flame-soft:#173425; --mint:#173425; --green:#3ECF86; --blue:#3AA9FF; --lilac:#D9A8FF; --sun:#F5D76E; --coral:#F79A9A;
    --ok:#3ECF86; --ok-soft:#173425; --warn:#F5D76E; --warn-soft:#332E12; --bad:#F79A9A; --bad-soft:#3A1E1E; --idle:#A0B1A8; --idle-soft:#1E2C25;
    --p-exp:#3ECF86; --p-ofi:#6FC0FF; --p-noof:#D9A8FF; --p-calc:#F5D76E; --p-inf:#A0B1A8;
    --b-exp:#3ECF86; --b-ofi:#3AA9FF; --b-noof:#D9A8FF; --b-calc:#F5D76E; --b-inf:#7E8F86;
    --t-exp:rgba(62,207,134,.12); --t-ofi:rgba(58,169,255,.12); --t-noof:rgba(217,168,255,.12); --t-calc:rgba(245,215,110,.12); --t-inf:transparent;
    --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--flame)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Estructura */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--font-head);font-weight:600;font-size:1.05rem;line-height:1.25}
.brand small{display:block;font-family:var(--font);font-weight:400;color:var(--muted);font-size:.8rem;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius);font-size:.95rem}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--mint);color:var(--flame);font-weight:700;box-shadow:inset 3px 0 0 var(--green)}
.nav button:focus-visible{outline:3px solid var(--flame)}
.nav .cnt{font-size:.78rem;color:var(--muted);min-width:1.6em;text-align:right}
.side .foot{margin-top:auto;font-size:.78rem;color:var(--muted)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--mint);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.search{flex:1 1 260px;position:relative;min-width:200px}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2}
.provbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.provbar .lbl{font-size:.82rem;color:var(--muted);margin-right:2px}
.gfbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end;width:100%}
.gfbar label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-weight:600;flex:0 1 380px;min-width:0;max-width:100%}
.gfbar select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);min-height:34px;width:100%;max-width:100%;min-width:0;font:inherit;font-size:.86rem}
.gfbar .gfhint{font-size:.76rem;color:var(--muted);align-self:center;flex:1 1 220px}
.gfnote{background:var(--mint);border:1px solid var(--green);border-left:4px solid var(--flame);padding:9px 12px;border-radius:var(--radius);font-size:.88rem;margin:0 0 12px}
.linkbtn{background:none;border:0;color:var(--flame);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0 0 0 6px}
.ttag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:4px;padding:2px 6px;background:var(--t-ofi);color:var(--p-ofi);margin-right:4px}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:.84rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.tbtn[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:7px 11px;cursor:pointer;font-size:.86rem;min-height:36px}
.iconbtn:hover,.tbtn:hover{border-color:var(--flame)}
.content{padding:22px 24px 80px;max-width:1280px}
section.mod{display:none}
section.mod.on{display:block}
h1,h2,h3{font-family:var(--font-head);font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.65rem;margin-bottom:8px;color:var(--flame);font-weight:800}
h2{color:var(--flame)}
h2{font-size:1.25rem;margin:28px 0 10px}
h3{font-size:1.02rem}
.lead{font-size:1.06rem;max-width:78ch;margin:8px 0 18px;color:var(--ink)}
.note{font-size:.86rem;color:var(--muted);max-width:78ch}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Procedencia */
.pv{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;font-weight:600}
.pv i{font-style:normal;font-size:.8rem}
.pv.exp{color:var(--p-exp);background:var(--t-exp);border-color:var(--b-exp)} .pv.ofi{color:var(--p-ofi);background:var(--t-ofi);border-color:var(--b-ofi)} .pv.noof{color:var(--p-noof);background:var(--t-noof);border-color:var(--b-noof)} .pv.calc{color:var(--p-calc);background:var(--t-calc);border-color:var(--b-calc)} .pv.inf{color:var(--p-inf);border-color:var(--b-inf);border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.84rem;color:var(--muted);padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}

/* Cadena del gas: elemento distintivo */
.chain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:6px 0 22px}
.link{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:16px 18px 16px 16px;border-right:1px solid var(--line);cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.link:last-child{border-right:0}
.link:hover{background:var(--soft)}
.link .stage{font-size:.8rem;color:var(--muted)}
.link .big{font-family:var(--font-head);font-size:1.55rem;font-weight:600;margin:4px 0 0;line-height:1.1}
.link .unit{font-size:.8rem;color:var(--muted)}
.link .say{font-size:.84rem;margin-top:8px;line-height:1.35}
.link .risk{display:block;height:4px;margin:-16px -18px 12px -16px}
.link .risk.r3{background:var(--coral)} .link .risk.r2{background:var(--sun)} .link .risk.r1{background:var(--green)}
.link:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}

/* Tarjetas y tablas */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi{border-top:3px solid var(--green)}
.kpi .name{font-size:.88rem;color:var(--muted)}
.kpi .val{font-family:var(--font-head);font-size:1.5rem;font-weight:700;color:var(--flame);margin-top:2px}
.kpi .val small{font-family:var(--font);font-size:.82rem;font-weight:400;color:var(--muted);margin-left:4px}
.kpi .per{font-size:.8rem;color:var(--muted)}
.kpi .why{font-size:.88rem;margin:8px 0}
.kpi .warn{font-size:.82rem;color:var(--warn);background:var(--warn-soft);border-left:3px solid var(--sun);padding:6px 8px;border-radius:4px;margin:8px 0}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ref{all:unset;cursor:pointer;font-size:.8rem;padding:4px 8px;border-radius:4px;background:var(--soft);display:inline-flex;gap:5px;align-items:center;min-height:28px}
.ref:hover{background:var(--flame-soft)}
.ref .refname{font-weight:600;color:var(--ink)}
.ref .pv{font-size:.68rem;padding:2px 5px}
.ref:focus-visible{outline:3px solid var(--flame)}
table{width:100%;border-collapse:collapse;background:var(--panel);font-size:.9rem}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{position:sticky;top:57px;background:var(--soft);font-weight:600;font-size:.84rem;z-index:2}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
.tablewrap th{top:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;align-items:flex-end}
.filters label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);min-height:38px;min-width:150px}
.count{font-size:.86rem;color:var(--muted);margin-bottom:10px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}

/* Hallazgos */
details.fd{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
details.fd>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:start}
details.fd>summary::-webkit-details-marker{display:none}
.pr{font-family:var(--font-head);font-weight:600;font-size:.82rem;border-radius:4px;padding:4px 7px;text-align:center;min-width:46px}
.pr.p1{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 -3px 0 var(--coral)} .pr.p2{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 -3px 0 var(--sun)} .pr.p3{background:var(--idle-soft);color:var(--idle)}
.fd .ttl{font-weight:600;font-size:1rem}
.fd .meta{font-size:.82rem;color:var(--muted);margin-top:3px}
.fd .chev{transition:transform .15s;color:var(--muted)}
details[open]>summary .chev{transform:rotate(90deg)}
.fbody{padding:0 16px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;border-top:1px solid var(--line);padding-top:14px}
.fbody .full{grid-column:1/-1}
.blk h4{font-size:.82rem;color:var(--muted);font-weight:600;margin:0 0 3px}
.blk p{margin:0;font-size:.93rem}
.blk.says{border-left:3px solid var(--green);padding-left:10px}
.blk.ask{background:var(--flame-soft);padding:10px 12px;border-radius:var(--radius)}
.quote{font-size:.86rem;border-left:2px solid var(--line);padding-left:8px;margin:4px 0 8px;color:var(--ink)}
.copy{border:1px solid var(--flame);color:var(--flame);background:transparent;border-radius:var(--radius);padding:6px 10px;cursor:pointer;font-size:.84rem;min-height:34px}
.copy:hover{background:var(--flame-soft)}

/* Estados */
.st{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;border-radius:4px;padding:3px 7px;white-space:nowrap}
.st.confirmada,.st.evasiva{background:var(--bad-soft);color:var(--bad)}
.st.porconciliar,.st.parcial,.st.verificar{background:var(--warn-soft);color:var(--warn)}
.st.explicada,.st.respondida{background:var(--ok-soft);color:var(--ok)}
.st.descartada,.st.pendiente{background:var(--idle-soft);color:var(--idle)}

/* Guion */
.block{margin-bottom:26px}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:2px solid var(--green);padding-bottom:6px;margin-bottom:10px}
.bhead .step{font-family:var(--font-head);font-size:1.15rem;font-weight:600}
.bhead .goal{color:var(--muted);font-size:.9rem;flex:1 1 300px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.q .qtop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:start}
.q .qid{font-family:var(--font-head);font-weight:600;color:var(--flame)}
.q .qtext{font-size:1.04rem;font-weight:500}
.q .qent{font-size:.84rem;color:var(--muted);margin-top:4px}
.q details>summary{cursor:pointer;padding:8px 16px;font-size:.88rem;color:var(--flame);border-top:1px solid var(--line)}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;padding:6px 16px 14px}
.route .r{border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;font-size:.88rem}
.route .r b{display:block;font-size:.8rem;margin-bottom:3px}
.route .r.yes b{color:var(--ok)} .route .r.no b{color:var(--bad)} .route .r.alt b{color:var(--warn)} .route .r.noc b{color:var(--p-noof)} .route .r.nod b{color:var(--idle)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;padding:4px 16px 14px;font-size:.9rem}
.qgrid h4{font-size:.8rem;color:var(--muted);margin:0 0 2px;font-weight:600}
.qgrid p{margin:0}


/* Botones y avisos */
.notice{background:var(--warn-soft);border:1px solid var(--sun);color:var(--ink);padding:10px 12px;border-radius:var(--radius);font-size:.88rem;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.btn{border:1px solid var(--flame);background:var(--flame);color:#fff;border-radius:var(--radius);padding:8px 12px;cursor:pointer;font-size:.88rem;min-height:38px}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--flame)}
/* Cuestionario */
.cqchip{border:1px solid var(--b-exp);background:var(--t-exp);color:var(--p-exp);border-radius:999px;padding:1px 8px;font-size:.8rem;font-weight:700;cursor:pointer;min-height:24px;line-height:1.4;vertical-align:baseline;margin:1px 0}
.cqchip:hover{background:var(--mint);border-color:var(--flame)}
.cqlist{background:var(--soft);border-radius:var(--radius);padding:10px 12px;margin-top:8px}
.cqlist h4{font-size:.8rem;color:var(--muted);margin:0 0 6px;font-weight:700}
.cqlist ul,.cqd ul{list-style:none;margin:0;padding:0}
.cqlist li,.cqd li{font-size:.88rem;margin:0 0 6px;line-height:1.45}
.cqtext{font-style:italic}
.cqsrc{font-size:.76rem}
.cqd{margin-top:6px;font-size:.84rem}
.cqd summary{cursor:pointer;color:var(--flame);font-weight:600}
.cqd ul{margin-top:6px}
.cqcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.cqhead{display:flex;justify-content:flex-start;gap:8px;align-items:center;flex-wrap:wrap}
.cqhead .st{margin-left:auto}
.cqlabel{font-family:var(--font-head);font-weight:800;color:var(--flame)}
.cqbig{margin:8px 0;font-size:1.04rem;line-height:1.5;font-style:italic;border-left:3px solid var(--line);padding-left:12px}
.cqmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;margin-top:10px;font-size:.88rem}
.cqmeta h4{font-size:.8rem;color:var(--muted);margin:0 0 4px;font-weight:700}
.cqmeta ul{margin:0;padding-left:18px}
@media print{.cqd{display:block}.cqd>summary{display:none}.cqchip{border:0;background:none;padding:0}}
/* Fuentes */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;border-bottom:3px solid transparent;font-size:.93rem}
.tabs button[aria-selected="true"]{border-bottom-color:var(--green);color:var(--flame);font-weight:600}
.tabs button:focus-visible{outline:3px solid var(--flame)}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--soft);margin:6px 0}
.bar span{display:block;height:100%}
.qa li{margin-bottom:4px;font-size:.9rem}

/* Gráficos */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line)} .chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .lab{fill:var(--ink);font-size:11px;font-weight:600}
.chart h3{background:var(--mint);color:var(--flame);font-weight:800;margin:-14px -16px 12px;padding:11px 16px;border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.chart figcaption{font-size:.84rem;color:var(--muted);margin-top:6px}

/* Secuencia */
.seq{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;counter-reset:s}
.seq button{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:.88rem;counter-increment:s}
.seq button::before{content:counter(s);display:block;font-family:var(--font-head);font-weight:800;color:var(--flame);font-size:1.1rem}
.seq button{border-top:4px solid var(--green)!important}
.seq button:hover{border-color:var(--flame)}
.seq button:focus-visible{outline:3px solid var(--flame)}

/* Panel de trazabilidad */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:50;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dbody{overflow:auto;padding:12px 16px 30px}
.drawer dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:0;font-size:.88rem}
.drawer dt{color:var(--muted)}
.drawer dd{margin:0}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.3);z-index:40;display:none}
.scrim.on{display:block}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:60vh;overflow:auto;display:none;z-index:30}
.results.on{display:block}
.results .grp{font-size:.78rem;color:var(--muted);padding:8px 12px 2px;font-weight:600}
.results button{all:unset;cursor:pointer;display:block;padding:7px 12px;font-size:.9rem;width:calc(100% - 24px)}
.results button:hover,.results button:focus-visible{background:var(--flame-soft)}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--flame)}100%{box-shadow:0 0 0 0 transparent}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:var(--radius);font-size:.9rem;z-index:60;display:none}
.toast.on{display:block}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1080px){
  .chain{grid-template-columns:repeat(3,minmax(0,1fr))}
  .link:nth-child(3n){border-right:0}
  .link:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .link::after{display:none}
  .seq{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .top{position:static}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap}
  .side .foot{display:none}
  .top{padding:10px 16px}
  .content{padding:16px 16px 70px}
  .fbody,.qgrid{grid-template-columns:1fr}
  th{top:0}
}
@media (max-width:560px){
  .chain{grid-template-columns:1fr 1fr}
  .link:nth-child(3n){border-right:1px solid var(--line)}
  .link:nth-child(2n){border-right:0}
  .link{border-bottom:1px solid var(--line)}
  .seq{grid-template-columns:1fr 1fr}
  .q .qtop{grid-template-columns:auto minmax(0,1fr)}
  .q .qtop .qact{grid-column:1/-1}
  h1{font-size:1.35rem}
}
@media print{
  .side,.top,.drawer,.scrim,.toast,.copy,.toolbar,.filters,  .app{display:block}
  body{background:#fff;color:#000}
  section.mod{display:block!important;page-break-before:always}
  section.mod:first-child{page-break-before:auto}
  .card,details.fd,.q,.tr{break-inside:avoid;box-shadow:none}
  th{position:static}
  .tablewrap{overflow:visible;border:0}
  .chain{grid-template-columns:repeat(3,1fr)}
  .link::after{display:none}
  [data-tab-panel]{display:block!important}
  a{color:#000}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegación">
    <div class="brand">Centro de mando · Debate del gas<small id="metaline"></small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div>Corte de la información: <span id="corte"></span></div>
      <div>Archivo autónomo: no envía datos a ningún servidor.</div>
      <button class="iconbtn" id="themeBtn" type="button" style="margin-top:8px">Cambiar tema</button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label class="sr" for="q">Buscar en todo el tablero</label>
        <input id="q" type="search" placeholder="Buscar en hallazgos, preguntas, contradicciones, entidades y fuentes" autocomplete="off">
        <div class="results" id="results" role="listbox" aria-label="Resultados de búsqueda"></div>
      </div>
      <div class="provbar" id="provbar" role="group" aria-label="Filtro de procedencia"><span class="lbl">Procedencia:</span></div>
      <div class="gfbar" id="gfbar" role="group" aria-label="Filtros por tema de la proposición y por cuestionario"></div>
      <button class="iconbtn" type="button" id="printBtn">Imprimir o guardar PDF</button>
    </div>
    <main class="content" id="content">
      <section class="mod" id="m-panorama" aria-labelledby="h-pan"></section>
      <section class="mod" id="m-hallazgos" aria-labelledby="h-hal"></section>
      <section class="mod" id="m-contras" aria-labelledby="h-con"></section>
      <section class="mod" id="m-guion" aria-labelledby="h-gui"></section>
      <section class="mod" id="m-cuestionario" aria-labelledby="h-cue"></section>
      <section class="mod" id="m-entidades" aria-labelledby="h-ent"></section>
      <section class="mod" id="m-fuentes" aria-labelledby="h-fue"></section>

</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-hidden="true">
  <header><h3 id="dtitle">Ficha de trazabilidad</h3><button class="iconbtn" id="dclose" type="button">Cerrar</button></header>
  <div class="dbody" id="dbody"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* Modelo de datos del tablero. Toda cifra lleva referencia (src + loc).
   Convención de páginas: p = posición en el PDF. Cada fuente declara si la numeración impresa coincide. */

  {id:"E05", short:"UPME · resp. 7 oct", cat:"exp", ent:"UPME", file:"UNIDAD MINERO ENERGETICA.pdf", title:"Respuesta UPME a la Proposición 49 (rad. 202601000315311)", date:"2026-10-07", type:"Respuesta oficial", pages:73, pnote:"Numeración impresa (Página N de 73) coincide con el PDF", ver:"Verificado en el original"},
  {id:"E06", short:"UPME · remisión", cat:"exp", ent:"UPME", file:"UPME ENERGETICA.pdf", title:"Remisión de la respuesta a puntos 8 y 41 (rad. 202601000319401)", date:"2026-10-09", type:"Oficio", pages:2, pnote:"Coincide con el PDF", ver:"Verificado en el original"},
  {id:"E07", short:"UPME · delegación", cat:"exp", ent:"UPME", file:"UPME ENERGETICA 2.pdf", title:"Delegación de asistencia al debate (rad. 202601000319281)", date:"2026-10-09", type:"Oficio", pages:2, pnote:"Coincide con el PDF", ver:"Verificado en el original"},
  {id:"E08", short:"UPME · traslado ANH", cat:"exp", ent:"UPME", file:"MINERO ENERGETICA.pdf", title:"Traslado parcial a la ANH de preguntas 1-5 y 11-15 (rad. 202601700303201)", date:"2026-09-28", type:"Oficio de traslado", pages:3, pnote:"Coincide con el PDF", ver:"Verificado en el original"},

  says:"La UPME basa sus escenarios en el ETPAGN 2023-2038: Oferta 1 usa la declaración de producción 2024-2033 (Res. 01626 de 2024) y Oferta 2 el IRR publicado en 2024; el complemento de enero de 2025 incorporó el IRR 2023. Con esos insumos proyecta ≈200 GBTUD de necesidad a fines de 2026 y déficit creciente desde el 1T 2029.",
  cross:"La ANH reporta 1P = 1.717 Gpc (IRR 2025) frente a 2.373 Gpc (IRR 2023). Fuera del expediente, la SSPD muestra que la declaración 2026-2035 rebaja el potencial de 2026 a 786,7 GBTUD (frente a 859,5).",
  analysis:"Las fechas de déficit que recibe el Senado descansan en una oferta que ya no existe. No se puede afirmar si el déficit real es mayor o menor sin una nueva corrida: la demanda del ETPAGN también era más alta.",
  missing:"Balance actualizado con IRR 2025 y declaración 2026-2035; fecha del nuevo ETPAGN.",
  q:"¿Con qué informe de reservas y qué declaración de producción calculó la UPME los déficits que reportó al Senado, y cuál es el déficit mensual 2026-2030 con el IRR 2025 y la declaración 2026-2035?",
  rq:"Si esa corrida no existe, ¿en qué fecha la entregará y quién la aprueba?",
  alt:"La UPME pudo correr balances actualizados que no incluyó en la respuesta.",
  limits:"La declaración 2026-2035 se tomó de una fuente externa oficial con revisión parcial (X03).",
  refs:[{s:"E05",p:14,q:"G-8",x:"Escenario de Oferta 1: contempla la proyección del potencial de comercialidad reportada en la declaración de producción 2024-2033 publicada por el MME mediante la Resolución 01626 del 27 de noviembre de 2024"},{s:"E05",p:54,q:"G-74",x:"el documento complementario de enero de 2025 incorporó las declaraciones de producción publicadas durante 2024 y el Informe de Recursos y Reservas 2023 divulgado por la ANH en 2024"},{s:"E05",p:22,q:"G-8",x:"Las cantidades de gas adicional requeridas en este caso serían del orden de 200 GBTUD. De igual forma, se proyecta un déficit creciente de gas natural a partir del primer trimestre de 2029"},{s:"E02",p:3,para:1, x:"Reservas probadas: 2.373 Gpc (2023) y 1.717 Gpc (2025), Figura 2"},{s:"X03",x:"Potencial de producción 2026: 859,5 GBTUD (declaración 2024-2033) y 786,7 GBTUD (declaración 2026-2035)"},{s:"C09"}]},
 {id:"H2", title:"La única terminal de importación falló y ninguna respuesta lo menciona", theme:"Importaciones y confiabilidad", ent:["MinMinas","UPME","CREG"], prio:1,
  prioWhy:"Riesgo de suministro ya materializado; afecta a todos los usuarios no esenciales.",
  ev:["exp","noof","calc"],
  says:"La UPME afirma que SPEC es «la única capacidad de almacenamiento de GNL operativa en el país» y que la regulación no contempla almacenamiento estratégico. Responde la pregunta 87 como un escenario hipotético.",
  cross:"Según prensa, el MinMinas declaró racionamiento programado del 25 al 29 de septiembre de 2026 (Res. 40524) por una falla técnica en SPEC. Las respuestas del expediente están fechadas entre el 30 de septiembre y el 8 de octubre.",
  analysis:"El riesgo de punto único de falla dejó de ser hipotético. El almacenamiento de SPEC equivale a unos 8 días de regasificación (cálculo aproximado).",
  missing:"Texto de la Res. 40524; informe técnico de la falla; volúmenes no atendidos por sector.",
  q:"¿Cuántos usuarios y qué volumen dejaron de recibir gas entre el 25 y el 29 de septiembre, por sector, y qué causó la falla de SPEC?",
  rq:"¿Qué medida con fecha evita que otra falla de SPEC deje sin gas a la demanda no esencial antes de que entren Puerto Bahía y PIO?",
  alt:"Las respuestas pudieron redactarse antes del evento.",
  limits:"El evento solo consta en prensa (N01). Obtener la resolución oficial antes del debate.",
  refs:[{s:"E05",p:60,q:"G-88",x:"la única capacidad de almacenamiento de GNL operativa en el país corresponde a la terminal de la Sociedad Portuaria El Cayao (SPEC LNG) en Cartagena"},{s:"E05",p:60,q:"G-88",x:"la regulación colombiana no contempla un marco de almacenamiento estratégico para gas natural"},{s:"E05",p:58,q:"G-87",x:"Una interrupción en el suministro internacional de Gas Natural Licuado (GNL) afectaría la suficiencia del sistema en la medida en que la duración del evento supere los inventarios operativos"},{s:"N01",x:"Res. 40524 del 25 sep 2026: racionamiento programado por condición técnica en SPEC; levantado el 29 sep"},{s:"X04",x:"Proyecto de resolución sobre mantenimientos programados de SPEC"},{s:"C08"}]},
 {id:"H3", title:"El gas importado cuesta 90,6 % más y nadie estima el efecto en la factura", theme:"Precios y tarifas", ent:["SSPD","CREG","Gestor del Mercado (BMC)","Gases del Caribe"], prio:1,
  prioWhy:"Efecto directo sobre usuarios regulados; las cifras de precio están documentadas.",
  ev:["exp","calc"],
  says:"SSPD: en agosto de 2026 el gas importado para demanda regulada costó 16,60 USD/MBTU y el nacional 8,71. Gestor: los contratos de octubre-noviembre de 2026 se pactaron a 20,40 USD/MBTU. SSPD y Gases del Caribe señalan que no es posible estimar el aumento en la factura.",
  cross:"El suministro (G) representa 52,18 % del costo unitario (SUPERINTENDENCIA DE SERVICIOS PUBLICOS.pdf, p. 5). Si G sube 10 % y lo demás no cambia, el costo unitario sube 5,2 %.",
  analysis:"La presión tarifaria es cuantificable con información que el Estado tiene (contratos por comercializador). La falta de estimación es una decisión, no una imposibilidad técnica.",
  missing:"Participación del gas importado en la canasta de cada comercializador; rezago de traslado; consumo medio por estrato.",
  q:"¿Qué porcentaje del gas que compran los diez mayores comercializadores para usuarios regulados es importado hoy, y cuánto subirá el componente G para estratos 1, 2 y 3 en el primer semestre de 2027?",
  rq:"Con los contratos ya registrados ante el Gestor, ¿cuál es esa cifra en pesos por metro cúbico?",
  alt:"Contratos a plazo, la TRM y el componente de distribución también explican alzas.",
  limits:"Las cifras de la SSPD y del Gestor no son directamente comparables (alcances distintos).",
  refs:[{s:"E12",p:12,q:"G-28,G-29",x:"Para agosto de 2026, el precio promedio ponderado observado para el gas importado fue de 16,60 USD/MBTU, mientras que para el gas de producción nacional fue de 8,71 USD/MBTU."},{s:"E11",p:5,q:"G-21",x:"la cantidad contratada asciende a 65.000 MBTUD, en su totalidad bajo la modalidad Firme al 95 % (CF95), con un precio promedio ponderado de 20,40 USD/MBTU"},{s:"E12",p:5,q:"SSPD-1",x:"Suministro (G): 52,18%, equivalente a $1.519,65/m3"},{s:"E13",p:3,q:"G-59",x:"no es posible determinar con suficiente certeza un incremento promedio mensual de la factura residencial"},{s:"C05"},{s:"C06"}]},
 {id:"H4", title:"Nadie responde cuánto gas se importa hoy ni qué porcentaje de la demanda representa", theme:"Importaciones y confiabilidad", ent:["UPME","Gestor del Mercado (BMC)"], prio:1,
  prioWhy:"Es el dato central del debate y el expediente no lo contiene.",
  ev:["exp","noof"],
  says:"La UPME trasladó las preguntas 16 y 17 al Gestor del Mercado. El oficio del Gestor en el expediente responde solo las preguntas 19, 20 y 21 y remite a una comunicación anterior (BMC-5646-2026) que no está en el expediente.",
  cross:"La UPME sí afirma que en 2025 «cerca del 19%» de la oferta fue importada. Gases del Caribe habla de «cerca del 39 %» en septiembre de 2026. La prensa reporta 31-33 % en junio-julio.",
  analysis:"Hay tres cifras de periodos y bases diferentes; ninguna es una respuesta oficial a las preguntas 16 y 17.",
  missing:"Oficio BMC-5646-2026; serie mensual de gas importado inyectado y su destino.",
  q:"¿Cuántos GBTUD de gas importado se inyectaron en promedio cada mes de 2026 y qué porcentaje de la demanda atendida representaron?",
  rq:"¿Cuánto de ese gas fue para térmicas y cuánto para hogares, comercio e industria?",
  alt:"BMC-5646-2026 pudo responderlas y no se incluyó en el expediente.",
  limits:"Verificar si BMC-5646-2026 llegó a la Secretaría.",
  refs:[{s:"E05",p:67,para:1, x:"Traslado al Gestor de las preguntas 16, 17, 19, 20, 21, 28, 29 y 45"},{s:"E11",p:2,x:"estas mismas preguntas fueron atendidas previamente mediante la comunicación BMC-5646-2026 del 5 de octubre de 2026"},{s:"E05",p:7,q:"UPME-2",x:"durante 2025 cerca del 19% de la oferta de gas natural correspondió a importaciones, según el Gestor del Mercado"},{s:"E13",p:2,q:"G-56",x:"al representar cerca del 39 % del suministro promedio de la demanda nacional"},{s:"N08",x:"21 % a inicios de 2026; 31 % en junio; 33 % primera semana de julio"}]},
 {id:"H5", title:"La regasificadora del Pacífico no puede entrar en las fechas que la UPME aún cita", theme:"Infraestructura de importación", ent:["UPME","MinMinas","CREG"], prio:1,
  prioWhy:"Cálculo simple y verificable; 400 Mpcd que no llegan en este cuatrienio.",
  ev:["exp","calc"],
  says:"La UPME cita como referencias el 4T 2029 (planta) y el 1T 2030 (gasoducto), con un plazo de 58 meses desde la selección del inversionista. Hubo dos convocatorias desiertas y aún no hay mecanismo de selección.",
  cross:"Octubre de 2026 + 58 meses = agosto de 2031, si se adjudicara hoy.",
  analysis:"Las fechas de referencia ya son inalcanzables; el proyecto no aporta gas en este cuatrienio.",
  missing:"Fecha y diseño de la nueva convocatoria; causas documentadas de las desiertas.",
  q:"¿En qué fecha abrirá la UPME la tercera convocatoria de la regasificadora del Pacífico y qué cambió frente a las dos declaradas desiertas?",
  rq:"Si se adjudica en 2027, ¿confirma que la planta no entraría antes de 2031?",
  alt:"Un nuevo diseño podría acortar el plazo; PIO cubre parcialmente el suroccidente (90 Mpcd).",
  limits:"",
  refs:[{s:"E05",p:10,q:"UPME-3",x:"plazo de 58 meses contado desde la selección del inversionista y referencias de entrada anticipada diferenciadas: cuarto trimestre de 2029 para la planta y primer trimestre de 2030 para el gasoducto"},{s:"E05",p:10,q:"UPME-3",x:"El ETPAGN registra dos convocatorias previas declaradas desiertas"},{s:"E10",loc:"hoja «Gas natural», fila 7, celda E7",x:"se han declarado desiertas, la primera hacia octubre de 2021 y la segunda en agosto de 2023"},{s:"C04"}]},
 {id:"H6", title:"La UPME llama «conceptos prospectivos» a proyectos que la ANLA ya tramita", theme:"Infraestructura de importación", ent:["UPME","ANLA"], prio:2,
  prioWhy:"Contradicción documental confirmada; afecta qué alternativas entran en la planeación.",
  ev:["exp"],
  says:"La UPME: Drummond, Ciénaga LNG y Puerto Brisa «se registran únicamente como conceptos prospectivos», sin soportes de permisos, financiación, cronograma o contratos.",
  cross:"ANLA: Ciénaga LNG en evaluación (radicado 12 may 2026; decisión estimada 23 dic 2026) y Puerto Drummond con cambio menor (radicación del 24 mar 2026). Ciénaga LNG: contrato de conexión con Promigas (15 sep 2026), cronograma con operación en el 1T 2028 e «Informe UPME Proyecto Ciénaga LNG, Julio 2026».",
  analysis:"Es falso que no haya permisos en trámite ni cronograma. Es cierto que no hay licencia otorgada, concesión firmada ni financiación acreditada.",
  missing:"Criterio de la UPME para incluir proyectos privados; informe UPME de julio de 2026 sobre Ciénaga LNG.",
  q:"¿Por qué la UPME informó que Ciénaga LNG no tiene permisos ni cronograma, si la ANLA lo evalúa desde mayo y la empresa dice haber reportado a la UPME en julio?",
  rq:"¿Qué criterio usa para incluir un proyecto privado en sus balances y cuáles lo cumplen hoy?",
  alt:"La UPME pudo usar «soportes consolidados» en sentido estricto (decisión de inversión).",
  limits:"No se tuvo acceso al «Informe UPME» de julio de 2026 que menciona la empresa.",
  refs:[{s:"E05",p:33,q:"G-34",x:"Otras iniciativas mencionadas en antecedentes sectoriales (tales como Drummond, Ciénaga LNG y Puerto Brisa) se registran únicamente como conceptos prospectivos de privados, sin que a la fecha se hayan consolidado soportes de permisos, financiación, cronograma o contratos"},{s:"E16",p:2,q:"AD-1",para:1, x:"LAV0022-00-2026 · Ciénaga LNG · radicación 12/05/2026 · En evaluación (respuesta a información adicional) · decisión estimada 23/12/2026"},{s:"E15",p:4,q:"G-34",para:1, x:"LAM0150 · Puerto Drummond · Cambio menor autorizado (Radicación ANLA 20263300304311, 24/03/2026)"},{s:"E14",p:2,q:"G-39",x:"Portada y hoja de firmas contrato de conexión al SNT Sociedad Portuaria Ciénaga LNG SA y Promigas SA, 15 de septiembre 2026"},{s:"E14",p:2,q:"G-39",x:"Informe UPME Proyecto Ciénaga LNG, Julio 2026"}]},
 {id:"H7", title:"Las dos tablas de demanda de la UPME son versiones distintas del mismo estudio", theme:"Planeación y abastecimiento", ent:["UPME"], prio:2,
  prioWhy:"Diferencia de hasta 255 GBTUD en un año; la evidencia es sólida, pero la causa es de rotulación.",
  ev:["exp","ofi","calc"],
  says:"La UPME presenta dos tablas del escenario medio 2026-2035: la de la p. 4 (2027: 991,6 GBTUD) y la Tabla 1 de la p. 6 (2027: 1.247,0 GBTUD), ambas atribuidas a la proyección de abril de 2026.",
  cross:"La versión final publicada (abr 2026) da 946 GBTUD para 2030, como la tabla de la p. 4; la preliminar (feb 2026) da 1.049, como la Tabla 1. La demanda no térmica es idéntica desde 2027.",
  analysis:"Toda la diferencia es térmica y depende del año en que se simula El Niño. Ninguna de las dos tablas se usó para calcular el déficit (que proviene del ETPAGN 2023-2038).",
  missing:"Cuál versión es oficial para el CACSSE y el plan de abastecimiento.",
  q:"¿Cuál de las dos proyecciones de demanda que entregó la UPME es la oficial para planear el verano 2026-2027?",
  rq:"¿Con cuál se calcularon los requerimientos térmicos que maneja el CACSSE?",
  alt:"Actualización legítima de la simulación hidrológica entre versiones.",
  limits:"Identificación de versiones basada en totales de los documentos externos (revisión parcial).",
  refs:[{s:"E05",p:4,q:"UPME-2",para:1, x:"2027 · Total nacional 991,6 · Térmico 207,2 (GBTUD)"},{s:"E05",p:6,q:"UPME-2",para:1, x:"Tabla 1 · 2027 · Total 1.247,0 · Termo 462,6 · Fuente: Proyección de Demanda de Gas Natural 2026-2042 (abril de 2026)"},{s:"E05",p:8,q:"UPME-2",para:1, x:"Gráfica 1: versión preliminar de febrero de 2026"},{s:"X01",x:"Total 2030 con termoeléctrico, escenario medio: 946 GBTUD"},{s:"X02",x:"Total 2030: 1.049 GBTUD"},{s:"C03"}]},
 {id:"H8", title:"Casi 4 de cada 10 pies cúbicos producidos no llegan al mercado", theme:"Reservas y producción", ent:["ANH"], prio:2,
  prioWhy:"Explica la diferencia entre producción y oferta; evidencia sólida.",
  ev:["exp","calc"],
  says:"Producción fiscalizada promedio ene-ago 2026: 1.124 Mpcd; 704 Mpcd se entregan fuera del campo (62,6 %). El 85 % de la producción se concentra en 20 campos; Pauto Sur aporta 342 Mpcd.",
  cross:"De los 420 Mpcd no comercializados, 251 se reinyectan (22,3 %). Los campos operados por Ecopetrol suman 65 % de la producción nacional.",
  analysis:"El margen para aumentar oferta liberando reinyección es técnico y puede costar reservas; no es una decisión administrativa simple.",
  missing:"Capacidad máxima de entrega por campo; plan de reinyección del Piedemonte.",
  q:"¿Cuánto gas adicional podría entregarse al mercado en los próximos 12 meses si se ajusta la reinyección del Piedemonte, y con qué pérdida de reservas?",
  rq:"¿Quién autoriza ese ajuste y existe hoy una solicitud en trámite?",
  alt:"La reinyección protege el recobro de condensados.",
  limits:"Dos franjas del gráfico no pudieron asignarse a una categoría exacta.",
  refs:[{s:"E02",p:7,q:"G-5",x:"en promedio para el período enero a agosto de 2026, la producción fiscalizada es de 1124 Mpcd, de los cuales 704 Mpcd corresponde al gas que se entrega del campo"},{s:"E02",p:6,q:"G-4",x:"el 85% de la producción se concentra en los 20 campos"},{s:"C02"}]},
 {id:"H9", title:"La caída de reservas 2022-2025 se explica por revisiones técnicas, no por falta de contratos", theme:"Reservas y producción", ent:["ANH","MinMinas"], prio:2,
  prioWhy:"Separa causas geológicas de decisiones de política; cifras sólidas, causalidad de mediano plazo no cuantificada.",
  ev:["exp","calc","noof"],
  says:"Incorporación neta 2022-2025: −29 Gpc, por revisiones técnicas de −370 Gpc (madurez del Piedemonte y agotamiento de Chuchupa). La ANH dice que la política de no suscribir contratos «no genera un impacto inmediato», aunque «a mediano plazo sí podría afectarse».",
  cross:"Sin revisiones técnicas, la incorporación habría sido +341 Gpc. Los pozos exploratorios bajaron de 68 (2022) a 27-33 por año. Prensa: la última ronda fue en 2021 y la ANH reservó ≈20 millones de hectáreas para nuevos contratos el 5 oct 2026.",
  analysis:"Atribuir la caída de 2022-2025 a la política de contratos no está sustentado en el expediente; su efecto es de mediano plazo y nadie lo cuantifica.",
  missing:"Revisiones por campo y operador; estimación del efecto de no asignar áreas.",
  q:"¿Cuánto de los −370 Gpc de revisiones técnicas 2022-2025 corresponde a cada campo y operador?",
  rq:"¿Cuántos Gpc estima la ANH que dejaron de incorporarse por no asignar áreas en 2022-2026, y con qué método?",
  alt:"La menor actividad exploratoria sí es indicio de efecto futuro.",
  limits:"La fecha de la última ronda proviene de prensa (N17).",
  refs:[{s:"E01",p:4,q:"ANH-2",para:1, x:"Tabla 1: Revisiones Técnicas −61, −66, −118, −125 (total −370); Totales 45, −58, 42, −58 (total −29)"},{s:"E01",p:5,q:"ANH-2",x:"La política de no suscripción de nuevos contratos de exploración de hidrocarburos aplicada durante las vigencias IRR 2022 al IRR 2025, no genera un impacto inmediato"},{s:"E01",p:3,q:"ANH-1",x:"se destacan los campos ubicados en el Piedemonte Llanero por alta complejidad técnica ... Guajira (Chuchupa), agotamiento natural del recurso"},{s:"E02",p:11,q:"G-15",x:"durante 2022 se perforaron 68 pozos exploratorios; en 2023, 42; en 2024, 27; y en 2025, 33"},{s:"N17",x:"Última ronda: 2021, contratos firmados en enero de 2022; reserva de ≈20 M ha (5 oct 2026)"},{s:"C01"}]},
 {id:"H10", title:"Gasoducto costa-interior: muy contratado, poco usado", theme:"Transporte", ent:["Gestor del Mercado (BMC)","CREG","SSPD","UPME"], prio:2,
  prioWhy:"Condiciona la llegada de gas importado al interior; evidencia de un mes, requiere explicación.",
  ev:["exp","calc","inf","noof"],
  says:"La UPME: el único enlace costa-interior es Ballena-Barrancabermeja (260 MPCD) y el gasoducto VIM-Interior es el proyecto «más crítico». Tabla SEGAS agosto 2026: 202.075 KPCD contratados, 57.925 disponibles, flujo medio 77.323 KPCD.",
  cross:"Cartagena-Barranquilla tiene 597.365 KPCD contratados sobre una capacidad máxima de 586.100; La Mami-Ballena (contraflujo), 120.576 sobre 102.900. Prensa: Ecopetrol pidió conexión en Coveñas en octubre de 2025 y no tenía respuesta en marzo de 2026, frente a un plazo de 5 días hábiles del RUT.",
  analysis:"Hoy el límite parece ser la falta de gas en la costa para enviar (inferencia). El tubo será restricción cuando llegue más gas importado.",
  missing:"Explicación del Gestor sobre tramos sobrecontratados; registro de solicitudes de acceso.",
  q:"¿Por qué hay tramos con más capacidad contratada que capacidad máxima, y cuánta capacidad firme hay para llevar gas importado al interior en el verano 2026-2027?",
  rq:"¿Cuántas solicitudes de conexión de regasificadoras están pendientes y desde cuándo?",
  alt:"Contratos interrumpibles o de corto plazo pueden explicar el exceso sobre la capacidad.",
  limits:"Un solo mes de datos; inferencia I01 por confirmar.",
  refs:[{s:"E05",p:28,q:"G-10",x:"actualmente solo está mediada por el gasoducto Ballena – Barrancabermeja con una capacidad de transporte de 260 MPCD"},{s:"E05",p:41,q:"G-45",para:1, x:"Ballena-Barrancabermeja: CMMP 260.000 · contratada 202.075 · disponible 57.925 · promedio 77.323 · máximo 131.076 (KPCD)"},{s:"E05",p:42,q:"G-45",para:1, x:"La Mami-Ballena (contraflujo): CMMP 102.900 · contratada 120.576 · disponible 0"},{s:"E05",p:43,q:"G-47",x:"hacen que el proyecto de conexión entre VIM – Interior sea el más crítico de los proyectos de transporte"},{s:"E05",p:44,q:"G-47",x:"El transportador debe analizar la factibilidad técnica y pronunciarse en un plazo de 5 días hábiles"},{s:"N12",x:"Solicitud de conexión radicada en octubre de 2025 sin respuesta a marzo de 2026"},{s:"C07"},{s:"I01"}]},
 {id:"H11", title:"Sirius sostiene el escenario sin déficit y no tiene licencia radicada", theme:"Reservas y producción", ent:["ANH","ANLA"], prio:2,
  prioWhy:"El único escenario sin déficit depende de Sirius; la ruta crítica no tiene holgura.",

  cross:"Prensa: 120 consultas previas (32 % protocolizadas a septiembre de 2026), licencia a radicar en el 1T 2027, decisión de inversión en 2027 y ≈3 años de obra; denuncia de exigencias de una comunidad.",

  missing:"Ruta crítica oficial; responsable de coordinar consultas, licencia y conexión.",
  q:"¿Cuál es la fecha comprometida de radicación de la licencia de Sirius y qué ocurre con el balance si el primer gas pasa a 2032?",
  rq:"¿Qué entidad coordina consultas, licencia y conexión al sistema de transporte?",
  alt:"Las empresas pueden avanzar ingeniería en paralelo.",
  limits:"Cronograma de las empresas tomado de prensa (N03, N04).",
  refs:[{s:"E02",p:10,q:"G-13",x:"el proyecto \"Sirius\", el cual se espera inicie la etapa de producción comercial a finales del año 2030 o comienzos del año 2031 con una tase esperada superior a los 400 Mpcd"},{s:"E16",p:3,q:"AD-7",x:"a la fecha no se están adelantando trámites de evaluación de licencia ambiental ni de modificación de licencia ambiental, de exploración o explotación de hidrocarburos costa afuera"},{s:"N03",x:"Licencia a radicar en el 1T 2027; hasta 470 Mpcd; 120 consultas"},{s:"N04",x:"38 de 120 consultas protocolizadas (32 %)"}]},
 {id:"H12", title:"Transporte con WACC de 11,88 %: siete investigaciones y una devolución que la SSPD no menciona", theme:"Precios y tarifas", ent:["SSPD","CREG"], prio:3,
  prioWhy:"Afecta el componente de transporte de la tarifa; la devolución solo consta en prensa.",

/* ---------- Módulo 7: Fuentes ---------- */
function traceStats(){
  const F = FINDINGS;
  const isPrecise = r => { const s = SRC[r.s]; return s && s.cat==="exp" && (r.p!=null || r.loc); };
  const precise = F.filter(f => f.refs.some(isPrecise) && f.refs.filter(r=>SRC[r.s]&&SRC[r.s].cat==="exp").every(isPrecise)).length;
  const nopage = F.filter(f => f.refs.some(r => SRC[r.s] && SRC[r.s].cat==="exp" && r.p==null && !r.loc)).length;
  const prev = F.filter(f => f.refs.some(r => SRC[r.s] && /previo/i.test(SRC[r.s].ver||""))).length;
  const calc = F.filter(f => findingCats(f).has("calc")).length;
  const ext = F.filter(f => { const c = findingCats(f); return c.has("ofi")||c.has("noof"); }).length;
  const pend = F.filter(f => findingCats(f).has("inf") || f.refs.some(r => SRC[r.s] && /no fue consultada|no identifica/i.test(SRC[r.s].ver||""))).length;
  return {n:F.length, precise, nopage, prev, calc, ext, pend};
}
function autoQA(){
  const out = [];
  FINDINGS.forEach(f => f.refs.forEach(r => { const s = SRC[r.s]; if(s && s.cat==="exp" && r.p==null && !r.loc) out.push(["Hallazgos sin referencia precisa", `${f.id}: ${s.file} sin página`]); }));
  INDICATORS.forEach(k => { if(!k.period) out.push(["Cifras sin fecha de corte", k.name]); if(!k.unit) out.push(["Unidades no especificadas o mezcladas", k.name]); });
  CONTRAS.forEach(c => { if(SRC[c.b.s] && SRC[c.b.s].cat==="calc") out.push(["Contradicciones sin segunda fuente", `${c.id}: segunda fuente es un cálculo`]); });
  QUESTIONS.forEach(q => { if(!q.h.length) out.push(["Preguntas sin soporte documental del expediente", q.id]); });
  return out;
}

    <dl><dt>Cuestionario</dt><dd>${esc(CQSETS[c.set])}</dd><dt>Sección</dt><dd>${esc(c.sec)}${c.sub?" · "+esc(c.sub):""}</dd>
    <dt>Transcrita en</dt><dd>${c.src.map(s => refBtn({s:s.s,p:s.p,q:c.id,x:c.q})).join(" ")}</dd>
    <dt>Respondida por</dt><dd>${c.ans.length?c.ans.map(x=>`${esc(x.ent)} ${refBtn({s:x.s,p:x.p,q:c.id})}${x.note?" — "+esc(x.note):""}`).join("<br>"):"No consta respuesta en el expediente"}</dd>
    <dt>Traslados</dt><dd>${c.tr.length?c.tr.map(t=>`De ${esc(t.from)} a ${esc(t.to)} (${esc(t.where)})`).join("<br>"):"No aplica"}</dd></dl>
    <h3 style="margin-top:16px">Uso en el tablero (${uses.length})</h3>
    ${uses.length?`<ul style="padding-left:18px;font-size:.9rem">${uses.map(u=>`<li><a href="#" data-go="${esc(u.go)}" data-close="1">${esc(u.label)}</a></li>`).join("")}</ul>`:'<p class="muted">Sin usos registrados.</p>'}
    <p><a href="#" data-go="cuestionario#${esc(c.id)}" data-close="1">Ver en el módulo Cuestionario</a></p>`;
  const d = $("#drawer"); d.classList.add("on"); d.setAttribute("aria-hidden","false"); $("#scrim").classList.add("on");
  d._prev = document.activeElement; $("#dclose").focus();
}
/* ---------- Ficha de trazabilidad ---------- */
function openTrace(idx){
  const r = REFREG[idx]; if(!r) return; const s = SRC[r.s]; if(!s) return;
  const NA = "No aplica", NC = "No consta en el documento", PV = "Pendiente de verificar";
  const isExp = s.cat==="exp", isExt = s.cat==="ofi"||s.cat==="noof";
  let page = NA;
  if(isExp){ page = r.loc ? r.loc : (r.p!=null ? (/Sin numeración/.test(s.pnote) ? `Página ${r.p} del PDF (el documento no tiene numeración impresa)` : `Página ${r.p} del PDF; numeración impresa: ${r.p}`) : (s.pages ? "Documento completo (" + s.pages + " págs.)" : NA)); }
  else if(isExt){ page = s.loc || "Página web o PDF sin ubicación precisa registrada"; }
  const uses = USAGE[s.id] || [];
  const rows = [
    ["Identificador", s.id],
    ["Clasificación", CATS[s.cat].long],
    ["Entidad o autor", s.ent],
    ["Documento", isExp ? s.file + " — " + s.title : s.title],
    ["Página", page],
    ["Ubicación adicional", r.q ? refQ(r).map(id => (CQ[id] ? CQ[id].label + ": «" + CQ[id].q + "»" : id)).join("\n") : (isExp ? NC : NA)],
    ["Fecha", s.date || NC],
    ["Evidencia", r.x ? ((isVerbatim(r) && !r.cpara) ? "Cita textual: «" + r.x + "»" : "Resumen fiel: " + r.x) : (s.result || s.basis || (isExp ? "Documento citado como soporte general" : NA))],
    ["URL", isExt ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>` : NA],
    ["Fecha de consulta", isExt ? s.consult : NA],
    ["Estado de verificación", s.ver || (s.cat==="inf" ? PV : "Ejecutado")],
    ["Tipo de documento", s.type || (s.cat==="calc" ? "Cálculo propio" : s.cat==="inf" ? "Hipótesis" : NA)]
  ];
  if(s.method) rows.push(["Método", s.method]); if(s.inputs) rows.push(["Entradas", s.inputs]); if(s.caveat) rows.push(["Advertencias", s.caveat]); if(s.toConfirm) rows.push(["Qué confirmar", s.toConfirm]);
  $("#dtitle").innerHTML = `Ficha de trazabilidad · ${esc(s.id)}`;
  $("#dbody").innerHTML = `<p>${pv(s.cat)}</p><dl>${rows.map(([k,v]) => `<dt>${esc(k)}</dt><dd style="white-space:pre-line">${k==="URL"?v:esc(v)}</dd>`).join("")}</dl>
    <h3 style="margin-top:16px">Uso en el tablero (${uses.length})</h3>
    ${uses.length?`<ul style="padding-left:18px;font-size:.9rem">${uses.map(u=>`<li><a href="#" data-go="${esc(u.go)}" data-close="1">${esc(u.label)}</a></li>`).join("")}</ul>`:'<p class="muted">Sin usos registrados.</p>'}`;
  const d = $("#drawer"); d.classList.add("on"); d.setAttribute("aria-hidden","false"); $("#scrim").classList.add("on");
  d._prev = document.activeElement; $("#dclose").focus();
}
function closeTrace(){
  const d = $("#drawer"); d.classList.remove("on"); d.setAttribute("aria-hidden","true"); $("#scrim").classList.remove("on");
  if(d._prev && d._prev.focus) try{ d._prev.focus(); }catch(e){}
}

/* ---------- Búsqueda global ---------- */
function searchIndex(){
  const idx = [];
  INDICATORS.forEach(k => idx.push({g:"Indicadores", t:k.name+" · "+k.value+" "+k.unit, h:[k.name,k.value,k.unit,k.why,k.warn].join(" "), go:"panorama#"+k.id, c:catsOf(k.refs)}));
  FINDINGS.forEach(f => idx.push({g:"Hallazgos", t:f.id+" · "+f.title, h:[f.id,f.title,f.says,f.cross,f.analysis,f.missing,f.q,f.rq,f.ent.join(" "),f.theme].join(" "), go:"hallazgos#"+f.id, c:findingCats(f)}));
  CONTRAS.forEach(c => idx.push({g:"Contradicciones", t:c.id+" · "+c.topic, h:[c.id,c.topic,c.a.x,c.b.x,c.nature,c.explain,c.q,c.ents.join(" ")].join(" "), go:"contras#"+c.id, c:contraCats(c)}));
  QUESTIONS.forEach(q => idx.push({g:"Preguntas", t:q.id+" · "+q.text, h:[q.id,q.text,q.ent,q.motive,q.expect,q.rEva,q.rCon].join(" "), go:"guion#"+q.id, c:questionCats(q)}));
  ENTITIES.forEach(e => idx.push({g:"Entidades", t:e.name+" · "+e.state, h:[e.name,e.scope,e.answered,e.pending,e.should].join(" "), go:"entidades#ent-"+e.name.replace(/\W+/g,"-"), c:new Set(CATKEYS)}));
  CUEST.forEach(c => idx.push({g:"Cuestionario", t:c.label+" · "+c.q, h:[c.label,c.id,"pregunta "+c.n,c.q,c.sec,c.sub].join(" "), cq:c.id, c:new Set(["exp"])}));
  SOURCES.forEach(s => idx.push({g:"Fuentes", t:s.id+" · "+(s.file||s.title), h:[s.id,s.file,s.title,s.ent,s.date,s.result].join(" "), src:s.id, c:new Set([s.cat])}));
  return idx;
}
let IDX = null;
function runSearch(q){
  const box = $("#results"); const t = norm(q.trim());
  if(t.length < 2){ box.classList.remove("on"); box.innerHTML=""; return; }
  IDX = IDX || searchIndex();
  const terms = t.split(/\s+/);
  const hits = IDX.filter(i => visible(i.c) && terms.every(w => norm(i.h).includes(w))).slice(0, 40);
  if(!hits.length){ box.innerHTML = `<div class="grp">Sin resultados para «${esc(q)}» con la procedencia activa. Pruebe otra palabra o active más procedencias.</div>`; box.classList.add("on"); return; }
  const groups = {};
  hits.forEach(h => (groups[h.g] = groups[h.g] || []).push(h));
  box.innerHTML = Object.entries(groups).map(([g, arr]) => `<div class="grp">${esc(g)} (${arr.length})</div>` + arr.map(h => h.cq ? `<button type="button" role="option" data-cq="${esc(h.cq)}">${esc(h.t)}</button>` : h.src ? `<button type="button" role="option" data-srcopen="${esc(h.src)}">${esc(h.t)}</button>` : `<button type="button" role="option" data-go="${esc(h.go)}">${esc(h.t)}</button>`).join("")).join("");
  box.classList.add("on");
}

/* ---------- Renderizado general ---------- */
function renderProv(){
  $("#provbar").innerHTML = `<span class="lbl">Procedencia:</span>` + CATKEYS.map(k => `<button type="button" class="tbtn" data-cat="${k}" aria-pressed="${ui.cats.has(k)}">${pv(k)}<span class="sr">${ui.cats.has(k)?"activa":"inactiva"}</span></button>`).join("") + `<button type="button" class="tbtn" data-cat="all" aria-pressed="true">Todas</button>`;
}
function renderAll(){
  REFREG.length = 0;
  renderNav(); renderProv(); renderGF();
  const R = {panorama:renderPanorama, hallazgos:renderHallazgos, contras:renderContras, guion:renderGuion, cuestionario:renderCuestionario, entidades:renderEntidades, fuentes:renderFuentes};
  if(document.body.classList.contains("printing")) Object.values(R).forEach(fn => fn());
  else R[ui.mod]();
  $$("section.mod").forEach(s => s.classList.toggle("on", s.id === "m-" + ui.mod));
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a,[data-go]"); if(!t) return;
  try{
    if(t.dataset.mod){ ui.mod = t.dataset.mod; renderAll(); setHash(ui.mod); window.scrollTo({top:0}); return; }
    if(t.dataset.go){ e.preventDefault(); if(t.dataset.close) closeTrace(); $("#results").classList.remove("on"); go(t.dataset.go); return; }
    if(t.dataset.cq){ e.preventDefault(); e.stopPropagation(); $("#results").classList.remove("on"); openCQ(t.dataset.cq); return; }
    if(t.dataset.ref){ e.preventDefault(); e.stopPropagation(); openTrace(+t.dataset.ref); return; }
    if(t.dataset.srcopen){ $("#results").classList.remove("on"); REFREG.push({s:t.dataset.srcopen}); openTrace(REFREG.length-1); return; }
    if(t.dataset.copy != null && t.classList.contains("copy")){ copyText(t.dataset.copy); return; }
    if(t.dataset.copyblock){ const qs = QUESTIONS.filter(q => q.b===t.dataset.copyblock && visible(questionCats(q)) && gQuestion(q)); const b = BLOCKS.find(x=>x.id===t.dataset.copyblock); copyText(b.name.toUpperCase() + "\n\n" + qs.map(qPlain).join("\n\n")); return; }
    if(t.dataset.cat){
      if(t.dataset.cat==="all") CATKEYS.forEach(k => ui.cats.add(k));
      else { ui.cats.has(t.dataset.cat) ? ui.cats.delete(t.dataset.cat) : ui.cats.add(t.dataset.cat); }
      IDX = null; renderAll(); return;
    }
    if(t.dataset.tab){ ui.tab = t.dataset.tab; renderAll(); return; }
    const act = t.dataset.act;
    if(act==="clear-fq"){ ui.fq = {set:"",sec:"",st:"",txt:""}; renderAll(); }
    else if(act==="clear-gf"){ ui.g = {t:"", c:""}; renderAll(); }
    else if(act==="clear-fh"){ ui.fh = {theme:"",ent:"",prio:"",cat:"",txt:""}; renderAll(); }
    else if(act==="clear-fc"){ ui.fc = {ent:"",theme:"",st:"",txt:""}; renderAll(); }
    else if(act==="copy-all"){ copyText(BLOCKS.map(b => b.name.toUpperCase()+"\n\n"+QUESTIONS.filter(q=>q.b===b.id && visible(questionCats(q)) && gQuestion(q)).map(qPlain).join("\n\n")).join("\n\n\n")); }
    else if(t.id==="printBtn"){ window.print(); }
    else if(t.id==="dclose"){ closeTrace(); }
    else if(t.id==="themeBtn"){
      const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const nx = cur==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx);
      try{ localStorage.setItem(KEY+"-theme", nx); }catch(err){}
    }
  }catch(err){ console.error(err); toast("Ocurrió un error en la acción; recargue la página si persiste"); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "q"){ runSearch(t.value); return; }
  if(t.dataset.gf != null){ ui.g[t.dataset.gf] = t.value; renderAll(); return; }
  if(t.dataset.fh){ ui.fh[t.dataset.fh] = t.value; const pos = t.selectionStart; renderAll(); const n = $(`[data-fh="${t.dataset.fh}"]`); if(n && n.tagName==="INPUT"){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } return; }
  if(t.dataset.fq){ ui.fq[t.dataset.fq] = t.value; const pos = t.selectionStart; renderAll(); const n = $(`[data-fq="${t.dataset.fq}"]`); if(n && n.tagName==="INPUT"){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } return; }
  if(t.dataset.fc){ ui.fc[t.dataset.fc] = t.value; const pos = t.selectionStart; renderAll(); const n = $(`[data-fc="${t.dataset.fc}"]`); if(n && n.tagName==="INPUT"){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } return; }
  if(t.dataset.fs){ ui.fs = t.value; const pos = t.selectionStart; renderAll(); const n = $(`[data-fs]`); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } return; }
});
document.addEventListener("change", e => {
  const t = e.target;
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeTrace(); $("#results").classList.remove("on"); }
  if(e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); }
});
document.addEventListener("click", e => { if(!e.target.closest(".search")) $("#results").classList.remove("on"); }, true);
$("#scrim").addEventListener("click", closeTrace);
window.addEventListener("beforeprint", () => { document.body.classList.add("printing"); renderAll(); $$("details").forEach(d => { d.dataset.wasOpen = d.open ? "1" : ""; d.open = true; }); });
window.addEventListener("afterprint", () => { document.body.classList.remove("printing"); renderAll(); });

/* ---------- Inicio ---------- */
try{ const th = localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
$("#metaline").textContent = META.proposicion;
$("#corte").textContent = META.corte;
const h = (location.hash||"").slice(1);
if(MODS.some(m => m.k === h)) ui.mod = h;
renderAll();
window.__TABLERO__ = {ui};
})();

</script>
</body>
