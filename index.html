*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--flame)}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}

/* Cabecera */
.hero{background:var(--mint);border-bottom:1px solid var(--line)}
.hero .wrap{padding-top:28px;padding-bottom:22px}
.kick{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--flame)}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;margin:8px 0 6px;font-weight:900;letter-spacing:-.01em}
.sub{font-size:1.05rem;color:var(--muted);margin:0 0 14px;max-width:760px}
.metaline{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--muted)}
.metaline b{color:var(--ink);font-weight:700}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.iconbtn{all:unset;cursor:pointer;font-size:.82rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.iconbtn:hover{border-color:var(--flame);color:var(--flame)}

/* Navegación rápida */
.jump{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0}
.jump .wrap{padding-bottom:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jump .wrap::-webkit-scrollbar{display:none}
.jump a{white-space:nowrap;text-decoration:none;font-size:.84rem;font-weight:700;color:var(--muted);padding:6px 11px;border-radius:999px;border:1px solid transparent}
.jump a:hover,.jump a.cur{color:var(--flame);border-color:var(--line);background:var(--panel)}

/* Secciones */
section.block{margin-top:40px}
.secno{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--flame)}
h2{font-size:1.5rem;margin:4px 0 6px;font-weight:900;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 16px;max-width:760px}

/* Idea central */
.idea{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--flame);border-radius:var(--radius);padding:18px 20px;font-size:1.12rem;line-height:1.55;box-shadow:var(--shadow)}
.idea b{color:var(--flame)}

/* Mensajes clave */
.msgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:16px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.msg .n{width:28px;height:28px;border-radius:50%;background:var(--flame);color:#fff;font-weight:900;display:grid;place-items:center;font-size:.9rem}
.msg h3{margin:0;font-size:1.02rem;line-height:1.3}
.msg .big{font-size:1.9rem;font-weight:900;color:var(--flame);line-height:1;letter-spacing:-.02em}
.msg .big small{display:block;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:4px}
.msg p{margin:0;font-size:.92rem;color:var(--ink)}
.msg .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:6px}

/* Temas (acordeón) */
.tema{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;box-shadow:var(--shadow);overflow:hidden}
.tema>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:14px 16px}
.tema>summary::-webkit-details-marker{display:none}
.tema>summary:hover{background:var(--soft)}
.tema .letter{width:40px;height:40px;border-radius:10px;background:var(--mint);color:var(--flame);font-weight:900;font-size:1.2rem;display:grid;place-items:center}
.tema .ttl{font-weight:800;font-size:1.05rem;line-height:1.25}
.tema .frase{color:var(--muted);font-size:.93rem;margin-top:3px}
.tema .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.sev{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:800;font-size:.74rem}
.sev.g3{background:var(--bad-soft);color:var(--bad)} .sev.g2{background:var(--warn-soft);color:var(--warn)} .sev.g1{background:var(--ok-soft);color:var(--ok)}
.chev{transition:transform .2s;color:var(--muted)}
.tema[open] .chev{transform:rotate(90deg)}
.tbody{padding:4px 16px 18px;border-top:1px solid var(--line)}
.tbody h4{margin:18px 0 8px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.aviso{background:var(--warn-soft);border-left:4px solid var(--sun);padding:10px 12px;border-radius:6px;font-size:.9rem;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:8px 8px;border-bottom:1px solid var(--line)}
th{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.v{font-weight:700}
ul.clean{margin:0;padding-left:20px}
ul.clean li{margin:6px 0}
ul.falta li{color:var(--ink)}
.q{background:var(--mint);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px}
.q b{display:block;font-size:1rem}
.q .rq{color:var(--muted);font-size:.9rem;margin-top:4px}
.more{margin-top:10px}
.more>summary{cursor:pointer;color:var(--flame);font-weight:700;font-size:.9rem;list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸ ";}
.more[open]>summary::before{content:"▾ ";}
.more .in{padding:8px 0 0}

/* Referencias y procedencia */
.ref{all:unset;cursor:pointer;font-size:.76rem;padding:3px 8px;border-radius:5px;background:var(--soft);display:inline-flex;gap:5px;align-items:center;min-height:24px;max-width:100%}
.ref:hover{background:var(--mint)}
.ref .rn{font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.pv{display:inline-flex;align-items:center;gap:3px;font-size:.66rem;font-weight:800;padding:1px 6px;border-radius:4px;white-space:nowrap}
.pv.exp{background:var(--t-exp);color:var(--p-exp)} .pv.ofi{background:var(--t-ofi);color:var(--p-ofi)} .pv.noof{background:var(--t-noof);color:var(--p-noof)} .pv.calc{background:var(--t-calc);color:var(--p-calc)} .pv.inf{background:var(--t-inf);color:var(--p-inf);border:1px dashed var(--p-inf)}
.refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cq{all:unset;cursor:pointer;display:inline-block;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:.76rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);margin:0}
.cq:hover{background:var(--mint)}
.hl{all:unset;cursor:pointer;color:var(--flame);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.copy{all:unset;cursor:pointer;font-size:.78rem;padding:4px 9px;border:1px solid var(--line);border-radius:6px;color:var(--flame);font-weight:700;margin-top:6px}
.copy:hover{background:var(--mint)}

/* Matriz */
.mxt{font-size:.82rem;min-width:860px}
.mxt th,.mxt td{padding:5px 4px}
.mx{text-align:center;font-weight:900;width:46px}
.mx-r{color:var(--ok)} .mx-n{color:var(--bad);background:var(--bad-soft)} .mx-t{color:var(--muted)}
td.mx-r{background:var(--ok-soft)}
.mxdot{all:unset;cursor:pointer;color:var(--ok);font-weight:900;font-size:1rem;padding:0 6px}
.mxdot:hover{color:var(--flame);text-decoration:underline}
.mxg>summary{font-size:.96rem;padding:8px 0}
body.mx-only-no .mxt tr:not(.mx-no):not(:first-child){display:none}
body.mx-only-no .mxt thead tr{display:table-row}
/* Entidades */
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ent{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:10px 12px}
.ent b{display:block;font-size:.98rem}
.ent i{font-style:normal;font-size:.78rem;font-weight:800;color:var(--c)}
.ent span{display:block;font-size:.84rem;color:var(--muted);margin-top:3px}

/* Fuentes */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.legend span{font-size:.84rem}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px;font-size:.86rem}
.srcgrid div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.srcgrid b{overflow-wrap:anywhere}
.note{font-size:.86rem;color:var(--muted);margin-top:12px}

/* Intervención */
.speech p{font-size:1.02rem;line-height:1.6}
.speech h5{margin:16px 0 4px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--flame)}

/* Cajón de detalle */
.scrim{position:fixed;inset:0;background:rgba(20,38,28,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s;z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:1rem}
.drawer .body{padding:16px 18px 40px;overflow:auto;font-size:.94rem}
.drawer dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
.drawer dt{color:var(--muted);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.drawer dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
blockquote.big{margin:10px 0;padding:12px 14px;background:var(--mint);border-left:4px solid var(--flame);border-radius:6px;font-size:1.02rem;font-style:italic}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:60;font-size:.9rem}
.toast.on{opacity:1;transform:translateX(-50%)}
.muted{color:var(--muted)}
.fd{margin-top:10px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel)}
.fd h5{margin:0 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fd p{margin:0 0 8px;font-size:.92rem}


.scrollx{overflow:auto;-webkit-overflow-scrolling:touch}
.scrollhint{display:none}
@media (max-width:1024px){ .scrollhint{display:block} }
@media (max-width:760px){
  table.stack thead{display:none}
  table.stack tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  table.stack td{display:block;border:0;padding:2px 0}
  table.stack td.k{font-weight:800;font-size:.98rem;padding-bottom:4px}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .msgs{grid-template-columns:1fr}
  .msg .big{font-size:1.7rem}
  .hero .wrap{padding-top:20px}
  .topbar .iconbtn{font-size:.78rem;padding:6px 10px}
  .ents{grid-template-columns:1fr}
  .drawer .body{padding:14px 14px 40px}
}
@media (min-width:761px) and (max-width:1024px){
  .msgs{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 20px 80px}
}
@media (max-width:640px){
  #consumo .tema>div[style*="grid-template-columns:240px"]{grid-template-columns:1fr!important;justify-items:center}
  .tema>summary{grid-template-columns:36px 1fr}
  .tema .right{grid-column:2;flex-direction:row;align-items:center}
  .tema .letter{width:34px;height:34px;font-size:1rem}
  .drawer dl{grid-template-columns:1fr}
}
@media print{
  .jump,.topbar,.scrim,.drawer,.toast,.copy{display:none!important}
  .tema{break-inside:avoid}
  details.tema,details.more{open:true}
  .wrap{max-width:none}
  body{font-size:12.5px}
}

  {id:"C01", cat:"calc", ent:"Análisis propio", title:"Identidad de reservas y reposición", method:"1P(t) = 1P(t−1) − producción(t) + incorporación(t); I/P = Σ incorporación ÷ Σ producción", inputs:"ANH 3.pdf, p. 3 (Figura 2); ANH .pdf, p. 4 (Tabla 1)", result:"La identidad cuadra cada año 2017-2025 (diferencia máx. 1 Gpc). I/P 2016-2025 = 1.075 ÷ 3.720 = 28,9 %. 2022-2025: −29 Gpc; sin revisiones técnicas, +341 Gpc.", caveat:"Cifras redondeadas por la ANH.", ver:"Ejecutado en script"},
  {id:"C02", cat:"calc", ent:"Análisis propio", title:"Destino del gas fiscalizado ene-ago 2026", method:"Promedio simple de las 8 barras mensuales del gráfico «Uso del gas extraído»", inputs:"ANH 3.pdf, p. 7", result:"Fiscalizada 1.124,2; comercializada 703,8 (62,6 %); reinyectada 250,8 (22,3 %); otras dos franjas operativas 144,3 (12,8 %); residuo no rotulado 25,4 Mpcd.", caveat:"Las franjas de 100 y 50 Mpcd no pudieron asignarse con certeza a gas lift, consumo o transformado; el residuo se obtiene por diferencia.", ver:"Ejecutado en script"},
  {id:"C03", cat:"calc", ent:"Análisis propio", title:"Comparación de las dos tablas de demanda UPME", method:"Diferencia preliminar − final por año; diferencia no térmica = (total − térmico) preliminar − (total − térmico) final", inputs:"UNIDAD MINERO ENERGETICA.pdf, p. 4 y p. 6; X01; X02", result:"Desde 2027 la demanda no térmica es idéntica; la diferencia total coincide con la térmica (hasta +255,4 GBTUD en 2027).", caveat:"La identificación de versiones se basa en dos totales publicados (2030: 946 y 1.049 GBTUD).", ver:"Ejecutado en script"},
  {id:"C04", cat:"calc", ent:"Análisis propio", title:"Fecha mínima de la regasificadora del Pacífico", method:"Fecha de corte (oct 2026) + 58 meses de ejecución desde la selección", inputs:"UNIDAD MINERO ENERGETICA.pdf, p. 10 y p. 37", result:"Agosto de 2031 si se seleccionara inversionista en octubre de 2026.", caveat:"Supone que no se acorta el plazo regulatorio.", ver:"Ejecutado"},
  {id:"C05", cat:"calc", ent:"Análisis propio", title:"Brecha de precio importado − nacional", method:"(P_imp − P_nac) ÷ P_nac", inputs:"SUPERINTENDENCIA DE SERVICIOS PUBLICOS.pdf, p. 12-13", result:"Ago 2026: 7,89 USD/MBTU = 90,6 %. Jun: 94,4 %. Ene-may: 58-68 %.", caveat:"Demanda regulada, mercado primario.", ver:"Ejecutado en script"},
  {id:"C06", cat:"calc", ent:"Análisis propio", title:"Sensibilidad mecánica del costo unitario a G", method:"ΔCUv% = ΔG% × (G ÷ CUv)", inputs:"SUPERINTENDENCIA DE SERVICIOS PUBLICOS.pdf, p. 5", result:"G +10 % (resto constante) ⇒ CUv +5,2 %.", caveat:"No es la factura: omite consumo, subsidios y rezago de traslado.", ver:"Ejecutado en script"},
  {id:"C07", cat:"calc", ent:"Análisis propio", title:"Utilización del gasoducto Ballena-Barrancabermeja (agosto 2026)", method:"Contratado ÷ CMMP; volumen promedio ÷ CMMP; volumen máximo ÷ CMMP", inputs:"UNIDAD MINERO ENERGETICA.pdf, p. 41", result:"Contratado 77,7 %; flujo medio 29,7 %; flujo máximo 50,4 %.", caveat:"Un mes de datos.", ver:"Ejecutado en script"},
  {id:"C08", cat:"calc", ent:"Análisis propio", title:"Autonomía aproximada del almacenamiento de SPEC", method:"170.000 m³ GNL × ≈600 = ≈102 millones m³ ≈ 3,6 Gpc; ÷ 450 Mpcd", inputs:"UNIDAD MINERO ENERGETICA.pdf, p. 60", result:"≈8 días de regasificación a plena capacidad.", caveat:"Factor de expansión aproximado; no considera talón operativo ni nivel real de inventario.", ver:"Ejecutado en script"},
  {id:"C09", cat:"calc", ent:"Análisis propio", title:"Desactualización de los insumos de oferta de la UPME", method:"(1P IRR 2025 − 1P IRR 2023) ÷ 1P IRR 2023; potencial 2026 declaración 2026 − declaración 2024", inputs:"ANH 3.pdf, p. 3; UNIDAD MINERO ENERGETICA.pdf, p. 14 y 54; X03 Tabla 1", result:"1P −27,6 % (2.373 → 1.717 Gpc). Potencial 2026: 859,5 → 786,7 GBTUD (−72,8; −8,5 %).", caveat:"Depende de X03 (externa oficial, revisión parcial).", ver:"Ejecutado en script"},
  {id:"C10", cat:"calc", ent:"Análisis propio", title:"Suma de multas SSPD", method:"Suma de las 7 multas de la tabla", inputs:"SUPERINTENDENCIA DE SERVICIOS PUBLICOS.pdf, p. 9-10", result:"$4.330.234.550, igual al total que declara la SSPD.", caveat:"", ver:"Ejecutado en script"},
  {id:"C11", cat:"calc", ent:"Análisis propio", title:"Capacidad de regasificación de corto plazo anunciada", method:"Suma nominal de SPEC +58, PIO 90, Puerto Bahía 126, Caribe LNG 15; suma de cantidades declaradas al Gestor", inputs:"UNIDAD MINERO ENERGETICA.pdf, p. 24, 33, 35-37", result:"≈289 Mpcd nominales; ≈119 Mpcd declarados (sin SPEC).", caveat:"Mezcla de unidades y fases; la UPME advierte que no deben sumarse como oferta firme.", ver:"Ejecutado"},

  {id:"C12", cat:"calc", ent:"Análisis propio", title:"Costo de quedarse sin gas frente al precio del gas importado", method:"35,8 USD/MBTU (costo de racionamiento nacional, X05 Tabla 4-12) ÷ 16,60 USD/MBTU (importado, agosto) y ÷ 20,40 USD/MBTU (contratos oct-nov)", inputs:"Doc_Cost_Racionam_Gas_Nat_v5_21Ago2026.pdf, p. 77; SUPERINTENDENCIA DE SERVICIOS PUBLICOS.pdf, p. 12; BMC-5683-2026  Translado MME proposición No. 49.pdf, p. 5", result:"El costo de quedarse sin gas es 2,2 veces el precio del gas importado de agosto y 1,8 veces el de los contratos de octubre-noviembre; 2,1 veces la tarifa promedio (17,0 USD/MBTU).", caveat:"El costo de racionamiento está en precios de diciembre de 2025; los precios del gas importado son de 2026 y de universos distintos.", ver:"Ejecutado"},
  {id:"C13", cat:"calc", ent:"Análisis propio", title:"Valor ilustrativo de un día sin 15 GBTUD de demanda residencial", method:"15.000 MBTU ÷ 0,0353 MBTU por m³ ≈ 425.000 m³ × 8.752 $/m³ (costo de racionamiento residencial nacional)", inputs:"40524-2026.pdf, p. 2 (restricción de 15 GBTUD a la demanda esencial); Doc_Cost_Racionam_Gas_Nat_v5_21Ago2026.pdf, p. 52 (Tabla 4-1)", result:"≈ $3.700 millones por cada día.", caveat:"Hipotético: no se sabe cuánto gas dejó de entregarse realmente; supone 1.000 BTU por pie cúbico y aplica el costo residencial a toda la demanda esencial.", ver:"Ejecutado"},
  {id:"I01", cat:"inf", ent:"Análisis propio", title:"La restricción costa-interior hoy es de oferta y contratación, más que física", basis:"Ballena-Barrancabermeja con 77,7 % contratado pero 29,7 % de flujo medio (C07).", toConfirm:"Explicación del Gestor sobre contratos sin uso y disponibilidad de gas en la costa."},
  {id:"I02", cat:"inf", ent:"Análisis propio", title:"Salto del componente de distribución en octubre de 2025", basis:"Lectura de la Gráfica 2 escaneada (SUPERINTENDENCIA DE SERVICIOS PUBLICOS.pdf, p. 5): D pasa de ≈585 a ≈700 $/m³.", toConfirm:"Serie numérica del SSPD/SUI y acto CREG que lo origine."},
  {id:"I03", cat:"inf", ent:"Análisis propio", title:"«Caribe LNG» podría no ser el proyecto Coveñas de Ecopetrol/Cenit", basis:"La UPME la describe como solución terrestre con EIA en curso (UNIDAD MINERO ENERGETICA.pdf, p. 33); la ANLA lista en Coveñas un FSRU de Cenit (MINAMBIENTE.pdf, p. 4-5).", toConfirm:"Identidad del promotor (la UPME lo marca «no disponible», UNIDAD MINERO ENERGETICA.pdf, p. 38)."},
  {id:"I04", cat:"inf", ent:"Análisis propio", title:"La «Resolución CREG 101 127 de 2026» citada por la UPME sería la versión final del proyecto 701 127", basis:"UNIDAD MINERO ENERGETICA.pdf, p. 59 cita la 101 127; X04 es un proyecto 701 127 sobre mantenimientos de SPEC.", toConfirm:"Texto definitivo en el gestor normativo de la CREG."},
  {id:"I05", cat:"inf", ent:"Análisis propio", title:"La marca «RESERVADO» del oficio del Gestor podría ser una clasificación interna", basis:"Aparece en el pie de las 6 páginas (BMC-5683-2026  Translado MME proposición No. 49.pdf) sin invocar norma de reserva; el contenido remite a tableros públicos del BEC.", toConfirm:"Fundamento jurídico de la clasificación."}

  cross:"Cartagena-Barranquilla tiene 597.365 KPCD contratados sobre una capacidad máxima de 586.100; La Mami-Ballena (contraflujo), 120.576 sobre 102.900. Prensa: Ecopetrol pidió conexión en Coveñas en octubre de 2025 y no tenía respuesta en marzo de 2026, frente a un plazo de 5 días hábiles del RUT.",
  analysis:"Hoy el límite parece ser la falta de gas en la costa para enviar (inferencia). El tubo será restricción cuando llegue más gas importado.",
  missing:"Explicación del Gestor sobre tramos sobrecontratados; registro de solicitudes de acceso.",
  q:"¿Por qué hay tramos con más capacidad contratada que capacidad máxima, y cuánta capacidad firme hay para llevar gas importado al interior en el verano 2026-2027?",
  rq:"¿Cuántas solicitudes de conexión de regasificadoras están pendientes y desde cuándo?",
  alt:"Contratos interrumpibles o de corto plazo pueden explicar el exceso sobre la capacidad.",
  limits:"Un solo mes de datos; inferencia I01 por confirmar.",
  refs:[{s:"E05",p:28,q:"G-10",x:"actualmente solo está mediada por el gasoducto Ballena – Barrancabermeja con una capacidad de transporte de 260 MPCD"},{s:"E05",p:41,q:"G-45",para:1, x:"Ballena-Barrancabermeja: CMMP 260.000 · contratada 202.075 · disponible 57.925 · promedio 77.323 · máximo 131.076 (KPCD)"},{s:"E05",p:42,q:"G-45",para:1, x:"La Mami-Ballena (contraflujo): CMMP 102.900 · contratada 120.576 · disponible 0"},{s:"E05",p:43,q:"G-47",x:"hacen que el proyecto de conexión entre VIM – Interior sea el más crítico de los proyectos de transporte"},{s:"E05",p:44,q:"G-47",x:"El transportador debe analizar la factibilidad técnica y pronunciarse en un plazo de 5 días hábiles"},{s:"N12",x:"Solicitud de conexión radicada en octubre de 2025 sin respuesta a marzo de 2026"},{s:"C07"},{s:"I01"}]},
 {id:"H11", title:"Sirius sostiene el escenario sin déficit y no tiene licencia radicada", theme:"Reservas y producción", ent:["ANH","ANLA"], prio:2,
  prioWhy:"El único escenario sin déficit depende de Sirius; la ruta crítica no tiene holgura.",
  ev:["exp","noof"],
  says:"ANH: Sirius iniciaría producción comercial a fines de 2030 o comienzos de 2031 con más de 400 Mpcd (≈40 % de la demanda). ANLA: no hay trámites de licencia costa afuera en evaluación.",
  cross:"El MinInterior confirma (20 oct): Sirius está «pendiente de radicar el Estudio de Impacto Ambiental», el trámite «se encuentra detenido debido a que no se ha podido protocolizar la consulta previa» y la comunidad de Taganga «mantiene expectativas muy altas»; ≈120 comunidades y ≈80 consultas realizadas, cifra que el propio oficio marca «por verificar». Prensa: licencia a radicar en el 1T 2027, decisión de inversión en 2027 y ≈3 años de obra.",
  analysis:"Ya no es solo un riesgo de cronograma: el Gobierno reconoce por escrito que el proyecto está detenido en la consulta previa. Con una licencia que tarda y ≈3 años de obra, la fecha de 2030-2031 queda en duda.",
  missing:"Ruta crítica oficial; responsable de coordinar consultas, licencia y conexión.",
  q:"¿Cuál es la fecha comprometida de radicación de la licencia de Sirius y qué ocurre con el balance si el primer gas pasa a 2032?",
  rq:"¿Qué entidad coordina consultas, licencia y conexión al sistema de transporte?",
  alt:"Las empresas pueden avanzar ingeniería en paralelo.",
  limits:"Cronograma de las empresas tomado de prensa (N03, N04). La cifra de ≈80 consultas es preliminar según el mismo oficio.",
  refs:[{s:"E19",p:5,q:"MININT-6",x:"El trámite se encuentra detenido debido a que no se ha podido protocolizar la consulta previa"},{s:"E19",p:5,q:"MININT-6",x:"Se registra un total aproximado de 120 comunidades en las que se deben adelantar procesos de consulta previa"},{s:"E02",p:10,q:"G-13",x:"el proyecto \"Sirius\", el cual se espera inicie la etapa de producción comercial a finales del año 2030 o comienzos del año 2031 con una tase esperada superior a los 400 Mpcd"},{s:"E16",p:3,q:"AD-7",x:"a la fecha no se están adelantando trámites de evaluación de licencia ambiental ni de modificación de licencia ambiental, de exploración o explotación de hidrocarburos costa afuera"},{s:"N03",x:"Licencia a radicar en el 1T 2027; hasta 470 Mpcd; 120 consultas"},{s:"N04",x:"38 de 120 consultas protocolizadas (32 %)"}]},

  says:"La respuesta a la pregunta 71 repite la respuesta a la pregunta 72. Los párrafos sobre demanda industrial y GNV (p. 6) y el de pequeñas industrias (p. 48) están cortados en el PDF. La UPME contesta las preguntas 55, 70, 72 y 98 y también las declara fuera de su competencia o trasladadas.",

 {id:"H17", title:"La UPME tiene un estudio del costo de quedarse sin gas y no lo usó para responder", theme:"Importaciones y confiabilidad", ent:["UPME","MinMinas","CREG"], prio:2,
  prioWhy:"Da la base económica para exigir almacenamiento y redundancia; la UPME lo tenía terminado antes de responder.",
  ev:["ofi","calc","exp"],
  says:"Según el estudio de la UPME de agosto de 2026, quedarse sin gas le cuesta al país en promedio 5.034 $/m³ (35,8 USD/MBTU), 2,1 veces la tarifa (2.386 $/m³). En hogares el costo es 8.752 $/m³, 2,7 veces la tarifa. El estudio dice que estos indicadores sirven «para determinar la viabilidad económica de la construcción de obras de infraestructura, al cotejar el costo de una obra contra el costo del racionamiento causado por no disponer de tales obras».",
  cross:"Ninguna de las 17 respuestas del expediente cita el estudio. La UPME respondió las preguntas 87, 88 y 41 sin estimar el costo de una interrupción ni el beneficio de un almacenamiento. El costo de quedarse sin gas es 2,2 veces el precio del gas importado de agosto (16,60 USD/MBTU) y 1,8 veces el de los contratos de octubre-noviembre (20,40).",
  analysis:"Con los propios números de la UPME, cualquier medida que evite racionamientos y cueste menos que el daño que evita se justifica: almacenamiento estratégico, una segunda terminal o respaldo en SPEC. Como ilustración, un día sin los 15 GBTUD de demanda esencial que restringió la falla de septiembre costaría del orden de $3.700 millones (cálculo hipotético).",
  missing:"Evaluación beneficio-costo del almacenamiento estratégico y de la regasificadora del Pacífico con este costo de racionamiento; costo del racionamiento de septiembre.",
  q:"Si la UPME estima que quedarse sin gas cuesta 35,8 dólares por millón de BTU, más del doble del gas importado, ¿por qué no usó ese estudio para responder qué pasaría con una interrupción del gas importado ni para evaluar el almacenamiento estratégico?",
  rq:"¿Cuánto le costó al país el racionamiento de septiembre según esa metodología, y cuándo se usará para evaluar la regasificadora del Pacífico?",
  alt:"El estudio puede no estar adoptado oficialmente para la planeación; su versión 5 está fechada el 21 de agosto de 2026.",
  limits:"Muestra de 512 usuarios (4 del sector petrolero, 10 térmicas, 16 hogares en la mayoría de regiones) por encuesta hipotética. El estudio promedia solo las duraciones de un día y un mes y deja fuera la de una semana, que es la más baja. El texto da 3.396 $/m³ para hogares y la tabla de la misma página 8.752. No menciona gas importado ni regasificación.",
  refs:[{s:"X05",p:6,x:"los indicadores de costos de racionamiento se han aplicado para determinar la viabilidad económica de la construcción de obras de infraestructura, al cotejar el costo de una obra contra el costo del racionamiento causado por no disponer de tales obras"},{s:"X05",p:77,para:1,x:"Tabla 4-12: gas natural, tarifa 2.386 $/m³ (17,0 USD/MBTU); costo de racionamiento mínimo 5.034 $/m³ (35,8 USD/MBTU)"},{s:"X05",p:75,para:1,x:"Tabla 4-11: residencial nacional, tarifa 3.285 y costo de racionamiento 8.752 $/m³"},{s:"X05",p:50,x:"entre las tres duraciones de racionamiento estudiadas, se asume como representativa el promedio de los valores mensual y diaria"},{s:"X05",p:47,para:1,x:"Tabla 3-16: muestra de 512 usuarios visitados"},{s:"E05",p:58,q:"G-87",x:"Una interrupción en el suministro internacional de Gas Natural Licuado (GNL) afectaría la suficiencia del sistema en la medida en que la duración del evento supere los inventarios operativos"},{s:"E12",p:12,q:"G-29",x:"el precio promedio ponderado observado para el gas importado fue de 16,60 USD/MBTU"},{s:"C12"},{s:"C13"}]},
 {id:"H18", title:"El Ministerio del Interior respondió dos veces y se contradice: la consulta previa de Sirius está detenida", theme:"Licenciamiento", ent:["MinInterior","MinMinas"], prio:1,
  prioWhy:"Es la primera confirmación oficial de que el proyecto que sostiene el único escenario sin déficit está detenido, y proviene de un ministerio que una semana antes decía lo contrario.",
  ev:["exp"],
  says:"Respuesta del 8 de octubre: «no se tienen identificados proyectos energéticos o gasíferos cuyo retraso o suspensión haya sido determinado o atribuido a la realización de procesos de consulta previa»; duración promedio de 6 meses (183 días) entre 2022 y 2026. Respuesta del 20 de octubre: Sirius está «pendiente de radicar el Estudio de Impacto Ambiental» y «el trámite se encuentra detenido debido a que no se ha podido protocolizar la consulta previa»; duración promedio de 9 meses.",
  cross:"Las dos respuestas llevan radicado oficial y salen de la misma Dirección de la Autoridad Nacional de Consulta Previa. La segunda conserva notas internas de redacción: «(Decidir si se menciona o no el decreto publicado)» y «por verificar con la coordinación del área». También dice que la ampliación de SPEC «entró en funcionamiento recientemente», dato que ninguna otra entidad reporta.",
  analysis:"El Senado recibió dos versiones oficiales incompatibles sobre el mismo cuestionario. La segunda es más franca y más grave: confirma que Sirius depende de una consulta previa sin fecha de cierre y que la causa es el desacuerdo con una comunidad (Taganga). También reconoce que no existe un estudio que mida el efecto de las consultas en el abastecimiento o las tarifas.",
  missing:"Cuál de las dos respuestas es la oficial; la matriz en Excel de consultas 2021-2026 anunciada en la primera; fecha estimada de protocolización de Sirius; verificación de las ≈80 consultas.",
  q:"Señor ministro del Interior, su Ministerio le dijo al Senado el 8 de octubre que ningún proyecto de gas está retrasado por consulta previa y el 20 de octubre que Sirius está detenido porque no se ha podido protocolizar la consulta. ¿Cuál es la respuesta oficial, cuántas de las 120 consultas de Sirius están protocolizadas y en qué fecha estima cerrar la de Taganga?",
  rq:"¿Por qué una respuesta oficial al Congreso llegó con notas internas sin depurar, y qué decreto es el que «se decide si se menciona»?",
  alt:"La segunda respuesta pudo elaborarse con información más reciente o de otra área; el promedio de 9 meses puede corresponder a un periodo distinto (cinco años frente a 2022-2026).",
  limits:"La primera respuesta es un escaneo leído por reconocimiento de texto; las cifras se verificaron en la imagen. La afirmación sobre la ampliación de SPEC no se contrastó con SPEC.",
  refs:[{s:"E18",p:9,q:"MININT-2",x:"no se tienen identificados proyectos energéticos o gasíferos cuyo retraso o suspensión haya sido determinado o atribuido a la realización de procesos de consulta previa"},{s:"E18",p:12,q:"MININT-3",x:"tienen una duración de seis (6) meses, equivalentes a aproximadamente ciento ochenta y tres (183) días"},{s:"E19",p:2,q:"MININT-3",x:"ha tenido una duración promedio de 9 meses, desde la etapa de preconsulta hasta la etapa de consulta"},{s:"E19",p:5,q:"MININT-6",x:"El trámite se encuentra detenido debido a que no se ha podido protocolizar la consulta previa"},{s:"E19",p:5,q:"MININT-6",x:"La comunidad de Taganga mantiene expectativas muy altas en el marco de la ruta metodológica establecida"},{s:"E19",p:5,q:"MININT-6",x:"Según reportes preliminares (por verificar con la coordinación del área/Natalia García de la DACNP), se habrían realizado aproximadamente 80 consultas"},{s:"E19",p:4,q:"MININT-5",x:"(Decidir si se menciona o no el decreto publicado)"},{s:"E19",p:8,q:"MININT-10",x:"El Ministerio no cuenta con una evaluación que demuestre que las demoras en las consultas previas hayan causado, o vayan a causar por sí solas, desabastecimiento de gas o aumento de tarifas"},{s:"E19",p:5,q:"MININT-6",x:"La regasificadora cuenta con una ampliación que entró en funcionamiento recientemente"}]},
 {id:"H19", title:"Una tutela obliga a consultar a comunidades wayuu por la regasificación en Ballena, el otro proyecto del plan de abastecimiento", theme:"Licenciamiento", ent:["MinInterior","UPME","MinMinas"], prio:2,
  prioWhy:"La regasificación de La Guajira es, junto con el Pacífico, uno de los dos proyectos de importación del plan oficial; la UPME no mencionó este riesgo.",
  ev:["exp"],
  says:"El Tribunal Administrativo de La Guajira, en tutela de segunda instancia, ordenó a TGI radicar ante la Autoridad Nacional de Consulta Previa la solicitud de determinación de procedencia de la consulta «respecto del proyecto de regasificación en el Campo Ballenas», y al Ministerio del Interior iniciar en un mes la verificación de comunidades wayuu afectadas por el gasoducto Ballena-Barrancabermeja. El Ministerio «está a la espera de que el ejecutor del proyecto allegue la información».",
  cross:"La UPME reportó al Senado que la regasificación de La Guajira (TGI, 250 MPCD) tiene informe técnico favorable enviado a la CREG el 1 de julio de 2026 y que solo falta la decisión regulatoria. No menciona la tutela ni la consulta previa. El MinInterior añade que la ampliación del Complejo Ballena para recibir gas costa afuera «requiere el desarrollo de procesos de consulta previa».",
  analysis:"El segundo punto de entrada de gas importado del plan oficial tiene un trámite de consulta previa que ni siquiera ha empezado, porque la empresa no ha radicado la información. Si la consulta procede, con un promedio de 6 a 9 meses y un historial de conflictos interclánicos en El Pájaro, la fecha del proyecto se corre.",
  missing:"Fecha de la sentencia y de su notificación; si TGI ya radicó; cronograma del proyecto de La Guajira con la consulta incluida.",
  q:"¿En qué fecha radicó TGI la solicitud de procedencia de la consulta previa para la regasificación en Ballena que ordenó la tutela, y cómo cambia eso la fecha de entrada del proyecto de La Guajira?",
  rq:"¿La UPME y la CREG conocían la tutela cuando evaluaron el proyecto?",
  alt:"La consulta podría declararse no procedente, o cerrarse en pocos meses si no hay afectación directa.",
  limits:"El número de radicado de la tutela se tomó de un documento escaneado.",
  refs:[{s:"E18",p:2,q:"MININT-1",x:"ORDENAR a la empresa Transportadora de Gas Internacional - TGI S.A. E.S.P. que, dentro del término de quince (15) días contados a partir de la notificación de la presente decisión, radique ante la Dirección de la Autoridad Nacional de Consulta Previa (DANCP) la solicitud de determinación de procedencia y oportunidad de la consulta previa respecto del proyecto de regasificación en el Campo Ballenas"},{s:"E18",p:3,q:"MININT-1",x:"Se está a la espera de la información por parte de TGI, para dar el inicio del trámite administrativo"},{s:"E19",p:5,q:"MININT-6",x:"Esta ampliación requiere el desarrollo de procesos de consulta previa con las comunidades del área de influencia"},{s:"E19",p:6,q:"MININT-6",x:"se presenta un conflicto histórico interclánico entre las familias Ipuana y Epinayú"},{s:"E05",p:33,q:"G-34",x:"Propuesta bajo evaluación IPAT. Informe técnico favorable remitido a la CREG el 1 de julio de 2026; pendiente decisión regulatoria"}]}
];

  const body = groups.map(g => {
    const r = g.items.filter(c=>c.st==="respondida").length, n = g.items.length - r;
    const rows = g.items.map(c => `<tr class="${c.st==="respondida"?"":"mx-no"}"><td style="position:sticky;left:0;background:var(--panel);white-space:nowrap">${chip(c.id, c.set==="G" ? String(c.n) : c.label)} <span class="muted" style="font-size:.74rem">${esc(c.q.length>60?c.q.slice(0,58).replace(/[\s,;:]+\S*$/,"")+"…":c.q)}</span></td>${MENT.map(e => { const x = cellOf(c,e); if(x.k==="r") return `<td class="mx mx-r" title="${esc(e)} respondió">${x.a.s?refDot(x.a):"●"}</td>`; if(x.k==="n") return `<td class="mx mx-n" title="${esc(e)} la recibió y no respondió">✕</td>`; if(x.k==="t") return `<td class="mx mx-t" title="${esc(e)} la trasladó">→</td>`; return `<td class="mx"></td>`; }).join("")}</tr>`).join("");
    return `<details class="more mxg"><summary>${esc(g.k)} <span class="muted" style="font-weight:600">· ${g.items.length} pregunta${g.items.length===1?"":"s"}: <span style="color:var(--ok)">${r} respondida${r===1?"":"s"}</span>, <span style="color:var(--bad)">${n} sin respuesta</span></span></summary><div class="in"><div class="scrollx"><table class="mxt"><thead>${head}</thead><tbody>${rows}</tbody></table></div></div></details>`;
  }).join("");
  return `<section class="block" id="matriz"><div class="secno">5 · La matriz</div><h2>Quién respondió qué, pregunta por pregunta</h2><p class="lead">Partiendo del cuestionario de la proposición: cada fila es una pregunta y cada columna una entidad. ${tot.r} preguntas tienen respuesta en el expediente y ${tot.n} se trasladaron y quedaron sin responder. Toque el número para leer la pregunta literal y el punto verde para abrir la fuente de la respuesta.</p>
    <div class="legend"><span><b class="mx-r" style="padding:1px 7px;border-radius:4px">●</b> Respondió (con archivo y página)</span><span><b class="mx-n" style="padding:1px 7px;border-radius:4px">✕</b> La recibió por traslado y no respondió</span><span><b class="mx-t" style="padding:1px 7px;border-radius:4px">→</b> La trasladó a otra entidad</span></div>
    <div class="topbar" style="margin:0 0 10px"><button type="button" class="iconbtn" id="mxOnlyNo">Mostrar solo las preguntas sin respuesta</button><button type="button" class="iconbtn" id="mxOpen">Abrir todas las secciones</button></div>
    <p class="note scrollhint" style="margin:0 0 6px">En pantallas pequeñas, deslice cada tabla hacia los lados.</p>
    ${body}</section>`;
}
function refDot(a){ const i = REG.push({s:a.s,p:a.p}) - 1; return `<button type="button" class="ref mxdot" data-ref="${i}" title="Ver la fuente de la respuesta">●</button>`; }

/* ---------- Render ---------- */
function render(){
  const E = EXEC;
  $("#t-title").textContent = E.meta.titulo; $("#t-sub").textContent = E.meta.sub; $("#t-ses").textContent = E.meta.sesion; $("#t-corte").textContent = E.meta.corte; $("#t-lectura").textContent = E.meta.lectura;
  document.title = "Debate del gas · " + E.meta.titulo;
  const msgs = E.mensajes.map((m,i)=>`<article class="msg"><div class="n">${i+1}</div><h3>${esc(m.t)}</h3><div class="big">${esc(m.cifra)}<small>${esc(m.cl)}</small></div><p>${esc(m.d)}</p><div class="foot">${(m.r||[]).map(refBtn).join("")}${(m.h||[]).map(h=>`<button type="button" class="hl" data-h="${h}">Hallazgo ${h}</button>`).join(" ")}</div></article>`).join("");
  const temas = E.temas.map(t=>`<details class="tema" id="tema-${t.k}">
    <summary><div class="letter">${t.k}</div><div><div class="ttl">${esc(t.t)}</div><div class="frase">${esc(t.frase)}</div></div><div class="right"><span class="sev g${t.g}">${t.g===3?"Prioridad alta":t.g===2?"Prioridad media":"Prioridad baja"}</span><span>${t.falta.length} sin respuesta · ${t.preguntas.length} preguntas</span><span class="chev">▶</span></div></summary>
    <div class="tbody">
      ${t.aviso?`<div class="aviso">${esc(t.aviso)}</div>`:""}
      <h4>Datos clave</h4>
      <table class="stack"><thead><tr><th>Dato</th><th>Cifra</th><th>Fuente</th></tr></thead><tbody>${t.datos.map(d=>`<tr><td class="k">${esc(d[0])}</td><td class="v" data-l="Cifra">${esc(d[1])}</td><td data-l="Fuente">${d[2].map(refBtn).join(" ")}</td></tr>`).join("")}</tbody></table>
      <h4>Lo que hay que saber</h4>
      <ul class="clean">${t.saber.map(s=>`<li>${lq(s[0])}${refs(s[1])}</li>`).join("")}</ul>
      <h4>Lo que no respondieron</h4>
      <ul class="clean falta">${t.falta.map(f=>`<li>${lq(f)}</li>`).join("")}</ul>
      <h4>Preguntas para la sesión</h4>
      ${t.preguntas.map(p=>`<div class="q"><b>${esc(p[0])}</b>${p[1]?`<div class="rq">Repregunta: ${esc(p[1])}</div>`:""}<button type="button" class="copy" data-copy="${esc(p[0]+(p[1]?"\n\nRepregunta: "+p[1]:""))}">Copiar</button></div>`).join("")}
      ${t.h&&t.h.length?`<details class="more"><summary>Ver los hallazgos completos de este tema (${t.h.length})</summary><div class="in">${t.h.map(h=>`<button type="button" class="hl" data-h="${h}">${esc(h+" · "+(FIND[h]?FIND[h].title:""))}</button><br>`).join("")}</div></details>`:""}
    </div></details>`).join("");
  const col = {ok:"var(--ok)", parcial:"var(--warn)", no:"var(--bad)"};
  const ents = E.entidades.map(e=>`<div class="ent" style="--c:${col[e[3]]}"><b>${esc(e[0])}</b><i>${esc(e[1])}</i><span>${lq(e[2])}</span></div>`).join("");
  const pedir = E.pedir.map(p=>`<tr><td class="v k">${esc(p[0])}</td><td data-l="Quién lo tiene">${esc(p[1])}</td><td data-l="Por qué importa">${esc(p[2])}</td></tr>`).join("");
  const iv = E.intervencion;
  const speech = iv.partes.map(p=>`<h5>${esc(p[0])}</h5><p>${esc(p[1])}</p>`).join("");
  const exp = SOURCES.filter(s=>s.cat==="exp"), ofi = SOURCES.filter(s=>s.cat==="ofi"), noof = SOURCES.filter(s=>s.cat==="noof"), calc = SOURCES.filter(s=>s.cat==="calc"||s.cat==="inf");
  $("#main").innerHTML = `
  <section class="block" id="esencial"><div class="secno">1 · Lo esencial</div><h2>En una frase</h2>
    <div class="idea">${esc(E.idea)}</div>
    <h2 style="margin-top:28px">Seis mensajes para el debate</h2><p class="lead">Cada mensaje trae su cifra, su fuente (abra cualquier chip para ver la ficha con la página) y el hallazgo que lo sustenta.</p>
    <div class="msgs">${msgs}</div></section>
  ${consumoHTML()}
  <section class="block" id="temas"><div class="secno">3 · Los nueve temas del cuestionario</div><h2>Tema por tema</h2><p class="lead">Abra cada tema para ver los datos clave, lo que hay que saber, lo que las entidades no respondieron y las preguntas sugeridas. Los números verdes abren el texto literal de la pregunta del cuestionario.</p>${temas}</section>
  <section class="block" id="quien"><div class="secno">4 · Quién respondió</div><h2>Quince entidades, cinco sin respuesta</h2><p class="lead">De ${CUEST.length} preguntas, ${CUEST.filter(c=>c.st==="respondida").length} tienen respuesta en el expediente y ${CUEST.filter(c=>c.st!=="respondida").length} se trasladaron a otra entidad y quedaron sin responder.</p><div class="ents">${ents}</div></section>
  ${matrixHTML()}
  <section class="block" id="traslados"><div class="secno">6 · Cómo se movieron las preguntas</div><h2>Los traslados por competencia</h2><p class="lead">Las entidades se pasaron las preguntas entre sí. De izquierda a derecha: quién traslada y quién recibe; el color dice cómo terminó. La línea punteada marca una pregunta enviada por segunda vez; las líneas gruesas son las cadenas.</p>
    <div class="legend"><span><i style="display:inline-block;width:22px;height:4px;background:var(--ok);vertical-align:middle"></i> Respondido</span><span><i style="display:inline-block;width:22px;height:4px;background:var(--warn);vertical-align:middle"></i> Parcial o fuera del expediente</span><span><i style="display:inline-block;width:22px;height:4px;background:var(--bad);vertical-align:middle"></i> Sin respuesta</span></div>
    <div class="scrollx" style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px">${flowSVG()}</div><p class="note scrollhint">En pantallas pequeñas, deslice el diagrama y la tabla hacia los lados.</p>
    <h4 style="margin:18px 0 8px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Las tres cadenas que importan</h4>
    ${EXEC.cadenas.map(c=>`<div class="fd"><h5>${esc(c.t)}</h5><p>${lq(c.d)}</p>${refs(c.r)}</div>`).join("")}
    <details class="more"><summary>Ver la tabla de los ${EXEC.traslados.length} traslados con su fuente</summary><div class="in"><table class="stack"><thead><tr><th>De</th><th>A</th><th>Preguntas</th><th>Resultado</th><th>Fuente</th></tr></thead><tbody>${EXEC.traslados.map(t=>`<tr><td class="k" data-l="De">${esc(t.from)}</td><td data-l="A">${esc(t.to)}</td><td data-l="Preguntas">${esc(t.q)}${t.label?`<div class="muted" style="font-size:.84rem">${esc(t.label)}</div>`:""}</td><td data-l="Resultado"><span class="sev ${t.st==="ok"?"g1":t.st==="par"?"g2":"g3"}">${t.st==="ok"?"Respondido":t.st==="par"?"Parcial":"Sin respuesta"}</span></td><td data-l="Fuente">${(t.r||[]).map(refBtn).join(" ")}</td></tr>`).join("")}</tbody></table></div></details></section>
  <section class="block" id="intervencion"><div class="secno">7 · Intervención sugerida</div><h2>«${esc(iv.titulo)}»</h2><p class="lead">${esc(iv.dur)}. Centrada en la falla de SPEC, Sirius y la regasificadora del Pacífico, con citas textuales de la resolución y de la UPME.</p>
    <details class="tema"><summary><div class="letter">✎</div><div><div class="ttl">Leer la intervención completa</div><div class="frase">Apertura, tres partes, preguntas y cierre</div></div><div class="right"><span class="chev">▶</span></div></summary><div class="tbody speech">${speech}<button type="button" class="copy" data-copy="${esc(iv.partes.map(p=>p[0].toUpperCase()+"\n"+p[1]).join("\n\n"))}">Copiar toda la intervención</button>
    <h4>Cuidados antes de leerla</h4><ul class="clean">${iv.cuidados.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div></details></section>
  <section class="block" id="pedir"><div class="secno">8 · Qué pedir</div><h2>Documentos que faltan</h2><p class="lead">Información que las entidades tienen y no entregaron. Conviene solicitarla antes de la sesión o exigirla en ella.</p>
    <table class="stack"><thead><tr><th>Documento o dato</th><th>Quién lo tiene</th><th>Por qué importa</th></tr></thead><tbody>${pedir}</tbody></table></section>
  <section class="block" id="fuentes"><div class="secno">9 · Fuentes</div><h2>Cómo leer las fuentes</h2>
    <div class="legend">${Object.keys(CATS).map(k=>`<span>${pv(k)} ${esc(CATS[k].long)}</span>`).join("")}</div>
    <p class="lead">Cada cifra abre una ficha con el archivo, la página y la cita textual o el resumen fiel. Las citas del expediente dicen el nombre del archivo tal como está en la carpeta y la página del PDF.</p>
    <h4 style="margin:14px 0 6px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Expediente: ${exp.length} documentos (${exp.reduce((a,s)=>a+(s.pages||0),0)} páginas y un Excel)</h4>
    <div class="srcgrid">${exp.map(s=>`<div><b>${esc(s.file)}</b><br><span class="muted">${esc(s.ent)} · ${esc(s.date)}${s.pages?" · "+s.pages+" págs.":""}</span><br>${refBtn({s:s.id})}</div>`).join("")}</div>
    <h4 style="margin:14px 0 6px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Fuentes oficiales externas (${ofi.length})</h4>
    <div class="srcgrid">${ofi.map(s=>`<div><b>${esc(s.file||s.title)}</b><br><span class="muted">${esc(s.ent)} · ${esc(s.date)}</span><br>${refBtn({s:s.id})}</div>`).join("")}</div>
    <p class="note">Además se consultaron ${noof.length} notas de prensa (marcadas como no oficiales) y se registraron ${calc.length} cálculos e inferencias propios, cada uno con su método y sus advertencias en la ficha. Las cifras se transcriben como las reportó cada entidad, incluidas sus inconsistencias. La prioridad de los temas y el estado de las respuestas son de esta revisión, no una valoración de las entidades. Versión completa con ${CUEST.length} preguntas, ${FINDINGS.length} hallazgos y ${CONTRAS.length} cruces: <a href="https://heyparalebola.github.io/control-politico-gas/" target="_blank" rel="noopener noreferrer">tablero detallado</a>.</p></section>`;
}

/* ---------- Cajón ---------- */
function openDrawer(title, html){ $("#dtitle").innerHTML = title; $("#dbody").innerHTML = html; const d=$("#drawer"); d.classList.add("on"); d.setAttribute("aria-hidden","false"); $("#scrim").classList.add("on"); d._prev=document.activeElement; $("#dclose").focus(); }
function closeDrawer(){ const d=$("#drawer"); d.classList.remove("on"); d.setAttribute("aria-hidden","true"); $("#scrim").classList.remove("on"); if(d._prev&&d._prev.focus) try{d._prev.focus();}catch(e){} }
function openTrace(i){
  const r = REG[i]; if(!r) return; const s = SRC[r.s]; if(!s) return;
  const NA="No aplica", NC="No consta";
  const isExp = s.cat==="exp", isExt = s.cat==="ofi"||s.cat==="noof";
  let page = NA;
  if(isExp) page = r.loc ? r.loc : (r.p!=null ? `Página ${r.p} del PDF` + (/coincide/i.test(s.pnote||"") ? " (coincide con la numeración impresa)" : "") : (s.pages ? "Documento completo ("+s.pages+" págs.)" : NA));
  else if(isExt) page = r.loc ? r.loc : (r.p!=null ? `Página ${r.p} del PDF` + (s.pnote?` (${s.pnote})`:"") : (s.loc || "Sin ubicación precisa registrada"));
  const rows = [["Clasificación", CATS[s.cat].long],["Entidad o autor", s.ent],["Documento", s.file ? s.file + (s.title?" — "+s.title:"") : s.title],["Página", page],["Fecha", s.date||NC]];
  if(r.x) rows.push(["Evidencia", (isExp && !r.para ? "Cita textual: «"+r.x+"»" : "Resumen fiel: "+r.x)]);
  if(s.method) rows.push(["Método", s.method]); if(s.inputs) rows.push(["Entradas", s.inputs]); if(s.result) rows.push(["Resultado", s.result]); if(s.basis) rows.push(["Base", s.basis]); if(s.caveat) rows.push(["Advertencias", s.caveat]); if(s.toConfirm) rows.push(["Qué confirmar", s.toConfirm]);
  if(s.ver) rows.push(["Verificación", s.ver]);
  const url = isExt ? (s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>` : esc(s.urlNote||NC)) : "";
  openDrawer(`Ficha de la fuente ${esc(s.id)}`, `<p>${pv(s.cat)}</p><dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}${url?`<dt>Enlace</dt><dd>${url}</dd>`:""}</dl>`);
}
function openCQ(id){
  const c = CQ[id]; if(!c) return;
  const src = c.src.map(s=>refBtn({s:s.s,p:s.p})).join(" ");
  const ans = c.ans.length ? c.ans.map(a=>`${esc(a.ent)} ${refBtn({s:a.s,p:a.p})}${a.note?" — "+esc(a.note):""}`).join("<br>") : "No consta respuesta en el expediente";
  const tr = c.tr.length ? c.tr.map(t=>`De ${esc(t.from)} a ${esc(t.to)} (${esc(t.where)})`).join("<br>") : "No aplica";
  openDrawer(`${esc(c.label)} · texto del cuestionario`, `<blockquote class="big">«${esc(c.q)}»</blockquote><dl><dt>Estado</dt><dd>${c.st==="respondida"?"Respondida en el expediente":"Solo trasladada: sin respuesta en el expediente"}</dd><dt>Sección</dt><dd>${esc(c.sec)}</dd><dt>Transcrita en</dt><dd>${src}</dd><dt>Respondida por</dt><dd>${ans}</dd><dt>Traslados</dt><dd>${tr}</dd></dl>`);
}
function openFinding(id){
  const f = FIND[id]; if(!f) return;
  const blk = (t, v) => v ? `<div class="fd"><h5>${t}</h5><p>${lq(v)}</p></div>` : "";
  openDrawer(`Hallazgo ${esc(f.id)} · prioridad ${f.prio}`, `<p><b style="font-size:1.05rem">${esc(f.title)}</b><br><span class="muted">${esc(f.theme)} · Dirigir a: ${esc(f.ent.join(", "))}</span></p>
    ${blk("Lo que dice la fuente", f.says)}${blk("Lo que muestra el cruce", f.cross)}${blk("Análisis para el debate", f.analysis)}${blk("Lo que falta aclarar", f.missing)}
    <div class="q"><b>${esc(f.q)}</b>${f.rq?`<div class="rq">Repregunta: ${esc(f.rq)}</div>`:""}<button type="button" class="copy" data-copy="${esc(f.q+(f.rq?"\n\nRepregunta: "+f.rq:""))}">Copiar</button></div>
    ${blk("Explicación alternativa por descartar", f.alt)}${blk("Limitaciones", f.limits)}
    <h5 style="margin:14px 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Evidencia</h5>
    ${f.refs.map(r=>`<div style="margin:6px 0">${refBtn(r)}${r.x?`<div class="muted" style="font-size:.86rem;margin:3px 0 0 6px;border-left:2px solid var(--line);padding-left:8px">${(SRC[r.s]&&SRC[r.s].cat==="exp"&&!r.para)?"«"+esc(r.x)+"»":esc(r.x)}</div>`:""}</div>`).join("")}`);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a"); if(!t) return;
  if(t.dataset.ref){ e.preventDefault(); openTrace(+t.dataset.ref); return; }
  if(t.dataset.cq){ e.preventDefault(); openCQ(t.dataset.cq); return; }
  if(t.dataset.h){ e.preventDefault(); openFinding(t.dataset.h); return; }
  if(t.dataset.copy!=null){ copyText(t.dataset.copy); return; }
  if(t.id==="dclose"){ closeDrawer(); return; }
  if(t.id==="mxOnlyNo"){ const on = document.body.classList.toggle("mx-only-no"); t.textContent = on ? "Mostrar todas las preguntas" : "Mostrar solo las preguntas sin respuesta"; if(on) $$("details.mxg").forEach(d=>d.open=true); return; }
  if(t.id==="mxOpen"){ const all=$$("details.mxg"); const open=all.some(d=>!d.open); all.forEach(d=>d.open=open); t.textContent = open ? "Cerrar todas las secciones" : "Abrir todas las secciones"; return; }
  if(t.id==="printBtn"){ $$("details").forEach(d=>d.open=true); window.print(); return; }
  if(t.id==="expandAll"){ const all=$$("details.tema"); const open=all.some(d=>!d.open); all.forEach(d=>d.open=open); t.textContent = open ? "Cerrar todos los temas" : "Abrir todos los temas"; return; }
  if(t.id==="themeBtn"){ const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); const nx=cur==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); try{localStorage.setItem(KEY+"-theme",nx);}catch(err){} return; }
});
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeDrawer(); });
try{ const th=localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
/* Resalta la sección visible en la navegación */
const io = new IntersectionObserver(es => { es.forEach(x => { if(x.isIntersecting){ $$(".jump a").forEach(a => a.classList.toggle("cur", a.getAttribute("href")==="#"+x.target.id)); } }); }, {rootMargin:"-40% 0px -55% 0px"});
render();
$$("section.block").forEach(s => io.observe(s));
})();

</script>
</body>
</html>
